# Dar al-Salam — campagna fundraising 2026
# Stack: Hugo extended + Cloudflare Pages

baseURL = "https://nuovamoschealugano.ch/"
title = "Dar al-Salam · Una nuova casa di pace"
defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true  # GO-LIVE 15.05.2026: robots.txt generato per indicizzazione
enableEmoji = false
disableHugoGeneratorInject = true
disableKinds = ["taxonomy", "term", "RSS"]

[minify]
  disableCSS = false
  disableHTML = false
  disableJS = false
  minifyOutput = true

[markup.goldmark.renderer]
  unsafe = true

# ---------- LINGUE ----------
# Ordine = ordine nello switcher
# IT default → /
# AR/EN/SQ → /ar/, /en/, /sq/
# DE/FR aggiunte in V1.5

[languages]

  [languages.it]
    languageCode = "it-IT"
    languageName = "Italiano"
    weight = 1
    [languages.it.params]
      htmlLang = "it"
      htmlDir = "ltr"

  [languages.ar]
    languageCode = "ar"
    languageName = "العربية"
    weight = 2
    [languages.ar.params]
      htmlLang = "ar"
      htmlDir = "rtl"

  [languages.en]
    languageCode = "en"
    languageName = "English"
    weight = 3
    [languages.en.params]
      htmlLang = "en"
      htmlDir = "ltr"

  [languages.sq]
    languageCode = "sq"
    languageName = "Shqip"
    weight = 4
    [languages.sq.params]
      htmlLang = "sq"
      htmlDir = "ltr"

  [languages.de]
    languageCode = "de"
    languageName = "Deutsch"
    weight = 5
    [languages.de.params]
      htmlLang = "de"
      htmlDir = "ltr"

  [languages.fr]
    languageCode = "fr"
    languageName = "Français"
    weight = 6
    [languages.fr.params]
      htmlLang = "fr"
      htmlDir = "ltr"

  [languages.tr]
    languageCode = "tr"
    languageName = "Türkçe"
    weight = 7
    [languages.tr.params]
      htmlLang = "tr"
      htmlDir = "ltr"

# ---------- PARAMS ----------
# Counter manuale: aggiornato la sera con commit
# data/counter.toml ha valori; qui solo fallback statici

[params]

  description = "Campagna fundraising 2026 per il nuovo centro culturale islamico a Lugano-Pregassona. Promosso da Lega dei Musulmani in Ticino."

  # Wordmark e brand
  wordmarkAR = "دار السلام"
  claimAR = "دار سلام جديدة"

  # Trust signals
  cheId = "CHE-112.406.415"
  esenzioneFiscaleAnno = "2014"
  registrocommercioData = "20.06.2005"
  comitatoData = "23.01.2019"

  # IBAN
  ibanFormatted = "CH44 0900 0000 6576 2899 3"
  ibanRaw = "CH4409000000657628993"
  bic = "POFICHBEXXX"

  # Indirizzi (CAP corretto 6962, da Copy V1 cowork)
  indirizzoModeschea = "Via Bottogno 12, 6962 Lugano-Viganello"
  indirizzoProgetto = "Via Ceresio 53B, Pregassona"
  mappale = "253 RFD Pregassona"
  superficie = "550 m²"
  architetto = "Beier Cabrini Architetti, Carabbia"
  # capienza (Spazi/Räume/Spaces/…) ora gestito via i18n "pf_capienza_value"

  # Contatti — mail ufficiale di progetto (footer, FAQ, donare)
  emailContatto = "info@islam-lugano.ch"
  # Email dedicata stampa/media e comunicazioni istituzionali (sezione trasparenza)
  emailStampa = "stampa.lmt@gmail.com"

  # URL pagamenti
  # sumupCarta = bottone "dona con carta" (donazione LIBERA, importo a scelta)
  sumupCarta = "https://pay.sumup.com/b2c/QG9XE1CT"
  # Link SumUp dedicati per i 4 importi fissi (box importi sezione donare)
  sumupCarta50 = "https://pay.sumup.com/b2c/QLVZNHDC"
  sumupCarta200 = "https://pay.sumup.com/b2c/Q9MNDQV7"
  sumupCarta1000 = "https://pay.sumup.com/b2c/Q0C0BMJ7"
  sumupCarta5000 = "https://pay.sumup.com/b2c/QB1N627X"

  # Sito ufficiale Lega dei Musulmani in Ticino (LMT) — per link di autorevolezza
  lmtWebsite = "https://islam-lugano.ch/"

  # Social Dar al-Salam Lugano (link puliti, senza tracking params)
  facebook = "https://www.facebook.com/people/Dar-Al-Salam-Lugano/61589136853286/"
  instagram = "https://www.instagram.com/daralsalam.lugano/"

  # Indicizzazione SEO: true = index,follow (produzione).
  # GO-LIVE 15.05.2026 — flippato da false a true insieme a enableRobotsTXT (riga 8).
  indexable = true

  # Analytics — caricamento gated da consenso cookie banner.
  # GA4 Measurement ID (creato 16/05/2026 dopo go-live).
  ga4MeasurementId = "G-GWYR3EVPDZ"

  # Importi suggeriti (CHF)
  importiSuggeriti = [50, 200, 1000]
