trasp_body_p1_pre = "<a href=\"https://islam-lugano.ch/\" target=\"_blank\" rel=\"noopener\">Lega dei Musulmani in Ticino</a>, 20 Haziran 2005 tarihinden itibaren "
trasp_body_p1_post = " numarası ile Tiçino Kantonu Ticari Sicili'ne kayıtlıdır. 13 Mart 2014'ten itibaren, Kanton Vergi Kanunu'nun 65. maddesinin g bendine ve federal LIFD'nin 56. maddesinin h bendine göre kendi gelirleri üzerinde kanton ve federal vergilerden muaftır."
trasp_body_p2 = "Hâlihazırda görevdeki komite 23 Ocak 2019'da seçildi. Başkan ve sayman <strong>Samir Gomaa</strong>'dır (münferit imza). Başkan yardımcısı, <strong>Radouan Jelassi</strong>. Üye ve sekreter, <strong>Adnan Al Hariri</strong>."
trasp_body_p3 = "Dar al-Salam kampanyasına yapılan bağışlar, derneğin olağan yönetiminden <strong>ayrılmış, özel bir PostFinance IBAN hesabına</strong> akar; Lega dei Musulmani in Ticino adına, \"Progetto Nuova Moschea\" özel açıklaması ile. Tüm hareketler izlenebilir ve denetlenebilir."
trasp_body_p4 = "Bağış raporu haftalık olarak bu sayfada yayınlanır. Derneğin tam yıllık bilançosu dosyalanmıştır ve mevcuttur."
