# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Bottogno'da yüz metrekarede namaz kıldığımız yirmi yıl. Yirmi yıldır misafiriz: namaz kıldığımız salon bizim değil, onu ay ay kiralıyoruz, yarın orada olacağına dair hiçbir güvence yok. Topluluk büyüdü, mekân büyümedi."
perche_v2_p2 = "<strong>Onu açık tutmak bize yaklaşık CHF 400'000 kira mal oldu.</strong> Işıkları yakan, ama hiçbir zaman evimize dönüşmeyen para."
perche_v2_p3 = "Bu yıl Allah bize bir kapı açtı. Pregassona'da, Via Ceresio 53B'de <strong>nihayet satın alabileceğimiz</strong> bir arazi var. Adını <strong>Dar al-Salam — yeni bir barış evi</strong> koyduk."
perche_v2_p4 = "<strong>15 Eylül'e kadar vaktimiz var.</strong> Eksik olanı birlikte toplamamız gerekiyor. Bugün bağışladığınız her frank <strong>sadaka jariye</strong>dir — bir çocuk o salonda her Kur'an öğrendiğinde, bir kardeş her teravih kıldığında, zorda kalan bir bacı dinleyen birini her bulduğunda meyve vermeye devam eden bir ameldir."
perche_p1 = "Yirmi yıldır Bottogno'da yüz metrekarede namaz kılıyoruz."
perche_p2 = "Lugano'da kimsenin bilmediği bir kapının arkasında, kiralık bir salon. Orada her cuma, Tiçino'daki yedi bin Müslüman cumayı kılmak için durabileceğini bilir. Orada El Nur pazar okulumuz, Lugano'da doğmuş İtalyanca konuşan otuza yakın çocuğa elif-ba'yı öğretir. Orada Ramazan ayında birlikte iftar ederiz, orada bir kardeş Allah'a döndüğünde cenaze namazını kılarız, orada Tiçino'ya gelip henüz evi olmayan kardeşleri ağırlarız."
perche_p3_pre = "O salonu ayakta tutmak için yirmi yıl boyunca yaklaşık "
perche_p3_strong = "CHF 400'000 kira"
perche_p3_post = " ödedik. Her ay bir mülk sahibine verilen, topluluğa hiçbir şey kalmayan paralar."
perche_p5_pre = "Bu yıl Allah bize bir kapı açtı. "
perche_p5_strong = "Pregassona'da, via Ceresio 53B'de"
perche_p5_post = " bir parsel var. Bizimdir. Mimar Beier Cabrini'nin stüdyosuyla birlikte satın aldık; projesi hazır: çok amaçlı salon, günlük namaz salonu, okul, ofis ve üstte merkezin işleyişini sonsuza dek karşılayacak altı daire."
perche_p6_pre = "Adını "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = " koyduk."
perche_p7_pre = "Arazi alımını, projeyi, noter senedini, aracılığı ve hukuki masrafları kapatmak için "
