# ---------- FAQ ----------
faq_eyebrow = "SSS"
faq_h2 = "Sıkça sorulan sorular"

faq_q1 = "Dar al-Salam için zekât verebilir miyim?"
faq_a1_p1 = "Cevap, izlediğiniz ekole bağlıdır. Dört klasik mezhebin (Hanefi, Maliki, Şafii, Hanbeli) ulemasının çoğu, zekâtın öncelikle Tevbe Suresi (60)'ta belirtilen sekiz sınıfa ayrıldığını ve cami inşasının doğrudan bunlara dahil olmadığını kabul eder. Bazı çağdaş ulema ise <em>fi sebilillah</em> kategorisini bunu kapsayacak şekilde genişletir."
faq_a1_p2 = "Belirsizlikten kaçınmak için size <strong>Dar al-Salam'a gönüllü bir sadaka ayırmanızı</strong> — zekât değil — ve zekâtınızı referans imamınızın veya zaten kullandığınız kuruluşun görüşüne göre vermenizi öneririz. Böyle bir proje için yapılan gönüllü sadaka, tüm ulema tarafından bir sadaka jariye biçimi olarak kabul edilir."

faq_q2 = "Düzenli bağış yapabilir miyim?"
faq_a2_p1 = "Evet, ve bizim için en değerli biçimdir. «Kart» sekmesinde bağışınızı ayda yalnızca CHF 20 dahi olsa <strong>aylık tekrarlanan</strong> bağışa dönüştürmeyi seçebilirsiniz. CHF 20'lik dört aylık tekrarlanan bağış, toplama planımıza güvenle giren CHF 80 demektir — planlama yapan bizler için bu, öngöremeyeceğimiz büyük tek seferlik bir bağıştan daha değerlidir."
faq_a2_p2 = "Düzenli bağış aynı zamanda klasik bir <strong>sadaka jariye</strong> biçimidir: hiçbir şey yapmanıza gerek kalmadan ay ay meyve vermeye devam eder."
faq_a2_p3 = "İstediğiniz zaman, hiçbir soru sorulmadan iptal edebilirsiniz."

faq_q3 = "Bir merhumun adına bağış yapabilir miyim?"
faq_a3_p1 = "Evet. Sadaka jariye'nin en şerefli biçimlerinden biridir. Peygamber (s.a.v.) şöyle buyurmuştur: <em>«Âdemoğlu öldüğünde üç şey hariç ameli kesilir — bir sadaka jariye, faydalanılan bir ilim veya kendisine dua eden salih bir evlat.»</em> (Müslim)."
faq_a3_p2 = "Kartla bağış yaparken, banka havalesinin açıklamasında veya bağış notlarında <em>«[adı]'nın anısına»</em> yazabilirsiniz. LMT konseyi isimlerin özel bir kaydını tutar ve merkezin açılışında onlar için dua eder. Hiçbir isim ailenin açık izni olmadan yayınlanmaz."

faq_q4 = "Bağışım vergiden düşülebilir mi?"
faq_a4_p1_pre = "Lega dei Musulmani in Ticino (LMT), 20 Haziran 2005 tarihinden itibaren "
faq_a4_p1_post = " numarası ile Ticari Sicil'e kayıtlıdır ve 13 Mart 2014'ten itibaren <strong>kendi gelirleri üzerinde</strong> kanton ve federal vergilerden muaftır."
faq_a4_p2 = "Aynı muafiyetin, bağışçı için bireysel bağışların düşülebilirliğine de uzanıp uzanmadığını <strong>doğruluyoruz</strong>. Bu, derneğin muafiyetinden farklı bir doğrulamadır ve vergi otoritelerinden resmi onay gerektirir. Yazılı yanıtı aldığımızda bu sayfayı güncelleyeceğiz."
faq_a4_p3 = "İtalyan, Fransız, Alman bağışçılar için: düşülebilirlik kendi ülkenizin mevzuatına ve İsviçre ile yapılan ikili anlaşmalara bağlıdır. E-posta ile aldığınız otomatik makbuzu saklayın — beyan verirken ihtiyacınız olacak belgedir."

faq_q5 = "Dar al-Salam ne zaman açılacak?"
faq_a5_p1 = "Aşamalar sırasıyla. <strong>15 Eylül 2026</strong>'ya kadar Faz 1'in (arazi + izinler) bağış toplamasını kapatıyoruz. Eylül 2026'dan 2027 sonuna kadar inşaat izinleri verilir ve Faz 2'nin finansal teminatı aranır. 2027 başından itibaren — <em>insha'Allah</em> — şantiye başlar. Tahmini inşaat süresi yaklaşık on sekiz aydır."
faq_a5_p2 = "Gerçekçi olarak merkezin <strong>2028 ile 2029</strong> arasında açılması bekleniyor."
faq_a5_p3 = "Aşamalardaki tüm güncellemeler haftalık olarak bu sayfada ve aylık olarak kamuya açık raporda yayınlanır."

faq_q6 = "Bağış toplamayı 15 Eylül'e kadar kapatamazsak ne olur?"
faq_a6_p1 = "Dürüst cevap: parsel, satıcıyla anlaşılan sürenin sonuna kadar bizim olarak kalır, ancak satın alma hakkını kaybetme ve yeniden arama riskini taşırız. Bu yüzden bu son tarih sembolik değil — gerçek."
faq_a6_p2 = "Her durumda, <strong>bağışlanan her frank özel olarak ayrılmış hesapta kalır</strong> (LMT'nin günlük yönetiminden ayrı bir PostFinance IBAN'ı) ve yalnızca Dar al-Salam projesi için kullanılır. Faz 1 zamanında kapanmazsa, LMT konseyi tam şeffaflıkla nasıl ilerleneceğini topluluğa bildirecektir."
faq_a6_p3 = "Bağış yapanlara karşı sorumluluğumuz takvimimizden önce gelir."

faq_q7 = "Bottogno'daki mevcut camiyi ziyaret edebilir miyim?"
faq_a7_p1 = "Evet, sizi bekliyoruz. Bottogno camisi gün boyunca, çoğu zaman gece de açıktır. Bizi namaz vakitlerinde bir arada bulabilirsiniz — kim olduğumuzu anlamak için en iyi an cuma günü, cuma namazında, topluluğun tamamı orada olduğunda."
faq_a7_p2_pre = "<strong>Adres:</strong> "
faq_a7_p3 = "Proje hakkında başkan veya konseyle özel görüşme yapmayı tercih ederseniz"
faq_a7_p3_post = " adresine yazın. 48 saat içinde yanıtlıyoruz."

faq_q8 = "Makbuz alacak mıyım?"
faq_a8_p1 = "Kart, Apple Pay ve Google Pay ile yapılan bağışlarda makbuz otomatik olarak e-posta ile gelir. Diğer yöntemler için almazsanız, bağışın tarihini ve tutarını belirterek"
faq_a8_p1_post = "adresine yazın, size göndeririz."
faq_a8_p2 = "Tüm makbuzlarda"
faq_a8_p2_post = "ve vergi muafiyeti referansı yer alır, gelir vergisi beyanı için geçerlidir."

