voci_prev_aria = "الشهادة السابقة"
voci_next_aria = "الشهادة التالية"
voci_dot_aria = "الانتقال إلى الشهادة"
voci_dots_aria = "موقع الشهادات"

voce1_quote = "«عندما وصل والدي إلى لوغانو، لم يكن الخيار الوحيد المتاح سوى الصلاة في البيت؛ أمّا أنا فقد استطعتُ أن أصلّي في فيا بوتونيو مع بضع عشرات من الإخوة. اليوم نحن سبعة آلاف في كلّ تيتشينو. وبعد عشرين عاماً، حان الوقت ليكون لنا بيتنا الخاص.»"
voce1_attrib_name = "سمير جمعة (Samir Gomaa)"
voce1_attrib_role = "رئيس Lega dei Musulmani in Ticino (LMT)"
voce1_alt = "سمير جمعة، رئيس Lega dei Musulmani in Ticino"
voce1_placeholder_label = "الصورة قادمة"

voce2_quote = "«بناء بيت لله صدقة جارية — عمل يستمرّ في إيتاء ثماره إلى يوم القيامة، كلّما صلّى فيه أخ، كلّما تعلَّم فيه طفل القرآن.»"
voce2_attrib_name = "الشيخ سمير الجلاصي"
voce2_attrib_role = "إمام المجتمع"
voce2_alt = "الشيخ سمير الجلاصي، إمام Lega dei Musulmani in Ticino"

voce3_quote = "«شبابنا كثيرون ويزدادون كلّ عام. ندرس متلاصقين، في أماكن لم تُصمَّم لهذا الغرض. دار السلام تعني لهم قاعة دراسية حقيقية — مكاناً يتعلّمون فيه القرآن بالكرامة التي يستحقّونها.»"
voce3_attrib_name = "أنس"
