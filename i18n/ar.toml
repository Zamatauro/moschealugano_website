# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "عشرون سنة ونحن نصلّي في مئة متر مربّع في بوتونيو. منذ عشرين سنة ونحن ضيوف: القاعة التي نصلّي فيها ليست لنا، نأخذها بالإيجار شهراً بعد شهر، دون يقين أنّها ستبقى هناك غداً. المجتمع كبر، أمّا المكان فلا."
perche_v2_p2 = "<strong>الحفاظ عليها مفتوحة كلّفنا حوالي 400'000 فرنك سويسري إيجاراً.</strong> أموال أبقت الأنوار مضاءة، لكنّها لم تتحوّل أبداً إلى بيتنا."
perche_v2_p3 = "هذا العام فتح الله لنا باباً. في بريغاسونا، في Via Ceresio 53B، توجد أرض <strong>يمكننا أخيراً شراؤها</strong>. أسميناها <strong>دار السلام — بيت سلام جديد</strong>."
perche_v2_p4 = "<strong>أمامنا وقت حتى 15 سبتمبر.</strong> ما يَنقُص علينا أن نجمعه معاً. كلّ فرنك تتبرّع به اليوم هو <strong>صدقة جارية</strong> — عمل يستمرّ في إيتاء ثماره كلّما تعلَّم طفل القرآن في تلك القاعة، كلّما صلّى أخ التراويح، كلّما وجدت أخت في ضيق مَن يُصغي إليها."
perche_p1 = "منذ عشرين عاماً ونحن نصلّي في مئة متر مربّع في بوتونيو."
perche_p2 = "قاعة مستأجَرة، خلف باب لا يعرفه أحد في لوغانو. هناك، كلّ يوم جمعة، يعلم سبعة آلاف مسلم في تيتشينو أنّ بإمكانهم التوقّف لأداء صلاة الجمعة. هناك تعلِّم مدرستنا الأحدية «النور» الألف-باء لنحو ثلاثين طفلاً وُلدوا في لوغانو ويتحدّثون الإيطالية. هناك نفطر معاً في شهر رمضان، هناك نصلّي على الجنائز عندما يعود أخ إلى الله، هناك نستقبل الإخوة والأخوات الذين يصلون إلى تيتشينو ولا منزل لديهم بعد."
perche_p3_pre = "للحفاظ على تلك القاعة، دفعنا في عشرين عاماً نحو "
perche_p3_strong = "400'000 فرنك سويسري إيجاراً"
perche_p3_post = ". أموال دُفعت لمالك، شهراً بعد شهر، دون أن يبقى منها شيء للمجتمع."
perche_p5_pre = "هذا العام، فتح الله لنا باباً. في "
perche_p5_strong = "بريغاسونا، Via Ceresio 53B"
perche_p5_post = "، توجد قطعة أرض. هي لنا. اشتريناها مع مكتب المهندس Beier Cabrini الذي أعدّ المشروع جاهزاً: قاعة متعدّدة الأغراض، قاعة للصلاة اليومية، مدرسة، مكتب، وست شقق فوقها ستغطّي تشغيل المركز إلى الأبد."
perche_p6_pre = "أسميناها "
perche_p6_strong = "دار السلام"
perche_p6_post = "."
perche_p7_pre = "نحتاج إلى "
perche_p7_strong_pre = " فرنك سويسري قبل 15 سبتمبر 2026"
perche_p7_strong_post = ""
perche_p7_post = " لإغلاق شراء الأرض، والمشروع، وعقد الكاتب العدل، والوساطة، والرسوم القانونية. جزء من المبلغ تمّ تأمينه بالفعل من الإخوة والأخوات الذين تبرّعوا في السنوات الماضية — "
perche_p7_raised_post = " فرنك. ما تبقّى نجمعه معاً في الأشهر الأربعة القادمة."
perche_p8_pre = "كلّ فرنك تضعه اليوم هو "
perche_p8_strong = "صدقة جارية"
perche_p8_post = ": عمل يستمرّ في إيتاء ثماره كلّما تعلَّم طفل قراءة القرآن في تلك القاعة، كلّما صلّى أخ التراويح في رمضان، كلّما وجدت أخت في ضيق مَن يصغي إليها."
