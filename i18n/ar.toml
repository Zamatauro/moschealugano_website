voci_eyebrow = "شهادات من المجتمع"
voci_h2 = "أصوات دار السلام"
voci_intro = "هؤلاء هم الناس الذين يحملون هذا المجتمع منذ عشرين عاماً. الرئيس، الإمام، أمّهات مدرسة الأحد، الشباب الذين وُلدوا في لوغانو، الشيوخ الذين فتحوا المسجد عندما كان المجتمع في لوغانو لا يزال حفنة من العائلات. هم الذين، في هذه الأسابيع، يختارون الوقوف أمام الكاميرا ليرووا ماذا ستكون دار السلام."
