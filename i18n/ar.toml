# ---------- PERCHE ORA ----------
perche_eyebrow = "لماذا الآن"
perche_h2 = "باب فُتِح أمامنا"

# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "عشرون سنة ونحن نصلّي في مساحة مئة متر مربّع في المسجد الحالي. منذ عشرين سنة ونحن ضيوف: القاعة التي نصلّي فيها ليست ملكاً للمسلمين، نستأجرها وندفع إيجارها شهراً بعد شهر. الجالية كبرت، والمكان أصبح ضيقاً."
perche_v2_p2 = "إيجار المكان الحالي كلّفنا حوالي <bdi>400'000</bdi> فرنك سويسري وضمن استمراره، لكنّه في الأخير ليس ملكاً لنا."
perche_v2_p3 = "هذا العام فتح الله لنا باباً. في Pregassona (Lugano)، Via Ceresio 53B، توجد أرض يمكننا أخيراً شراؤها. أسميناها <strong>دار السلام</strong>."
perche_v2_p4 = "<strong>أمامنا وقت حتى تاريخ 15 سبتمبر 2026</strong> لجمع باقي المبلغ معاً. كلّ فرنك تتبرّع به اليوم هو <strong>صدقة جارية</strong> — عمل يستمرّ في إيتاء ثماره كلّما تعلَّم طفل القرآن في هذا المركز، كلّما صلّى مصلٍّ أو تعبّد متعبّد."
perche_p1 = "منذ عشرين عاماً ونحن نصلّي في مئة متر مربّع في Viganello (Lugano)."
perche_p2 = "قاعة مستأجَرة، خلف باب لا يعرفه أحد في لوغانو. هناك، كلّ يوم جمعة، يعلم سبعة آلاف مسلم في تيتشينو أنّ بإمكانهم التوقّف لأداء صلاة الجمعة. هناك تعلِّم مدرستنا الأحدية «النور» الألف-باء لنحو ثلاثين طفلاً وُلدوا في لوغانو ويتحدّثون الإيطالية. هناك نفطر معاً في شهر رمضان، هناك نصلّي على الجنائز عندما يعود أخ إلى الله، هناك نستقبل الإخوة والأخوات الذين يصلون إلى تيتشينو ولا منزل لديهم بعد."
perche_p3_pre = "للحفاظ على تلك القاعة، دفعنا في عشرين عاماً نحو "
perche_p3_strong = "400'000 فرنك سويسري إيجاراً"
perche_p3_post = ". أموال دُفعت لمالك، شهراً بعد شهر، دون أن يبقى منها شيء للمجتمع."
perche_p5_pre = "هذا العام، فتح الله لنا باباً. في "
perche_p5_strong = "Pregassona (Lugano)، Via Ceresio 53B"
perche_p5_post = "، توجد قطعة أرض. هي لنا. اشتريناها مع مكتب المهندس Beier Cabrini الذي أعدّ المشروع جاهزاً: قاعة متعدّدة الأغراض، قاعة للصلاة اليومية، مدرسة، مكتب، وست شقق فوقها ستغطّي تشغيل المركز إلى الأبد."
perche_p6_pre = "أسميناها "
perche_p6_strong = "دار السلام"
perche_p6_post = "."
perche_p7_pre = "نحتاج إلى "
perche_p7_strong_pre = " فرنك سويسري قبل 15 سبتمبر 2026"
perche_p7_strong_post = ""
perche_p7_post = " لإغلاق شراء الأرض، والمشروع، وعقد الكاتب العدل، والوساطة، والرسوم القانونية. جزء من المبلغ تمّ تأمينه بالفعل من الإخوة والأخوات الذين تبرّعوا في السنوات الماضية — "
perche_p7_raised_post = " فرنك. ما تبقّى نجمعه معاً في الأشهر الأربعة القادمة."
perche_p8_pre = "كلّ فرنك تضعه اليوم هو "
perche_p8_strong = "صدقة جارية"
perche_p8_post = ": عمل يستمرّ في إيتاء ثماره كلّما تعلَّم طفل قراءة القرآن في تلك القاعة، كلّما صلّى أخ التراويح في رمضان، كلّما وجدت أخت في ضيق مَن يصغي إليها."
perche_cta = "تبرّع بصدقتك ←"

# ---------- VOCI ----------
voci_eyebrow = "شهادات من المجتمع"
voci_h2 = "أصوات دار السلام"
voci_intro = "هؤلاء هم الأشخاص الذين يحملون هذه الجالية منذ سنوات: الرئيس ومجلس إدارة الجمعية، الإمام، مدرّسي مدرسة النور، الشباب الذين وُلدوا في لوغانو، الأعضاء الذين واكبوا وساندوا المسجد عندما كانت الجالية في لوغانو لا تزال بضع عائلات. هم الذين، في هذه الأسابيع، سيختارون الوقوف أمام الكاميرا ليرووا كيف ستكون دار السلام."
voci_aria_label = "شهادات من المجتمع"
voci_prev_aria = "الشهادة السابقة"
voci_next_aria = "الشهادة التالية"
voci_dot_aria = "الانتقال إلى الشهادة"
voci_dots_aria = "موقع الشهادات"

voce1_quote = "«عندما وصل والدي إلى لوغانو، لم يكن الخيار الوحيد المتاح سوى الصلاة في البيت؛ أمّا أنا فقد استطعتُ أن أصلّي في المسجد الحالي مع بضع عشرات من الإخوة. اليوم نحن سبعة آلاف في كلّ مقاطعة تيتشينو. وبعد عشرين عاماً آن الأوان ليكون لنا مركزنا الخاص.»"
voce1_attrib_name = "سمير جمعة <bdi>(Samir Gomaa)</bdi>"
voce1_attrib_role = "رئيس <bdi>Lega dei Musulmani in Ticino (LMT)</bdi>"
voce1_alt = "سمير جمعة، رئيس Lega dei Musulmani in Ticino"
voce1_placeholder_label = "الصورة قادمة"

voce2_quote = "«بناء بيت لله هو صدقة جارية، عمل يستمرّ في إيتاء ثماره إلى يوم القيامة. كلّما صلّى وتعبّد فيه شخص، كلّما تعلَّم فيه طفل القرآن. كلّما استفاد أحد من مختلف الخدمات الدينية والتربوية والتعليمية والاجتماعية، فأجر ذلك يعود على كلّ متبرّع بالثواب العظيم؛ فمن بنى لله بيتاً في الأرض بنى الله له بيتاً في السماء.»"
voce2_attrib_name = "الشيخ سمير رضوان الجلاصي"
voce2_attrib_role = "إمام الجالية ونائب رئيس الرابطة"
voce2_alt = "الشيخ سمير الجلاصي، إمام Lega dei Musulmani in Ticino"

voce3_quote = "«شبابنا كثيرون ويزدادون كلّ عام. ندرس متلاصقين، في أماكن لم تُصمَّم لهذا الغرض. دار السلام تعني لهم قاعة دراسية حقيقية — مكاناً يتعلّمون فيه القرآن بالكرامة التي يستحقّونها.»"
voce3_attrib_name = "أنس"
voce3_attrib_role = "معلِّم"
voce3_alt = "أنس، معلِّم في المجتمع"


# ---------- FAQ ----------
faq_eyebrow = "الأسئلة الشائعة"
faq_h2 = "الأسئلة الأكثر تكراراً"

faq_q1 = "هل يمكنني دفع الزكاة لدار السلام؟"
faq_a1_p1 = "نعم يجوز دفع الزكاة إلى مشروع مثل دار السلام فهو يندرج ضمن الصنف القرآني <em>في سبيل الله</em>، وهو أحد المصارف الثمانية للزكاة المذكورة في سورة التوبة (الآية ٦٠)."
faq_a1_p2 = "وقد أكّد هذا الجواز عددا من العلماء المعاصرين والمجالس الفقهية الإسلامية معتبرة أنّ إقامة المساجد والمراكز الإسلامية وتأسيسها يندرج ضمن هذا الصنف، خاصّةً حينما يتعلّق الأمر بأقلّية مسلمة لا تستطيع - دون أموال الزكاة - أن تبني مسجدها، وقد أجازوا ذلك ايضا من باب الضرورة الشرعية، وهو حال الجالية المسلمة في تيتشينو بسويسرا اليوم."
faq_q1b = "تعمّق - لماذا تصحّ الزكاة لمشروع دار السلام"
faq_a1b_p1 = "حدّد القرآن الكريم (سورة التوبة، الآية ٦٠)، ثمانية مصارف للزكاة أحدها <em>«في سبيل الله»</em>. وقد ذكر العلماء في معنى هذا الصنف ثلاث قراءات: قراءة تقصره على القتال، وقراءة واسعة جداً تمدّه إلى كلّ عمل صالح، وقراءة وسطى - وهي المختارة - تجعله شاملاً لكلّ جهد يُبذل لإعلاء كلمة الله ومن صميم هذا الجهد الدعوة إلى الإسلام وتبليغه وإقامة شعائر الله للأقلية المسلمة."
faq_a1b_p2 = "وبناءً على ذلك، قرّرت هيئات فقهية معاصرة جواز صرف الزكاة في بناء المساجد والمراكز الإسلامية في بلاد الأقلّيات الإسلامية، معتبرة ان ذلك يدخل في حفظ دين الجالية المسلمة ويسهم في الحفاظ على هويتها. وممّا يؤكّد ذلك فتوى <strong>الاتحاد العالمي لعلماء المسلمين</strong> - بتوقيع الأستاذ الدكتور علي محيي الدين القره داغي، أمينه العام ونائب رئيس المجلس الأوروبي للإفتاء والبحوث - وقرار <strong>المجمع الفقهي الإسلامي لرابطة العالم الإسلامي</strong>. وليس هذا قولاً جديداً: فقد ورد التوسيع في اعتبار ان مصرف في سبيل الله يشمل وجوه الخير في التفاسير القديمة من ذلك تفسير الفخر الدين الرازي وابن العربي، كما أصدرت دار الإفتاء المصرية عام ١٩٤٤ فتوى صريحة في جواز صرف الزكاة لبناء المساجد."
faq_a1b_p3 = "ولا بدّ من توضيح نقطة مهمّة: ان هذه الفتاوى والآراء الفقهية تخصّ مساجد ومراكز الأقلّيات المسلمة. أمّا مساجد البلاد ذات الأغلبية المسلمة فجمهور الفقهاء لا يجيز صرف الزكاة لها. ودار السلام، في لوغانو بسويسرا تندرج تماماً ضمن الحالة الأولى: فهي من بيوت العبادة لأقلّية مسلمة، كما اننا نجد أنفسنا بعد عشرين عاماً من الإيجار لا تستطيع دون هذه الأموال وهذا المصرف من مصارف الزكاة أن نبني مركزا إسلاميا تقام فيه شعائر الله."
faq_a1b_p4 = "المصادر: الاتحاد العالمي لعلماء المسلمين، الفتوى رقم ٨٥٢٤ (<a href=\"https://iums.me/8524\" target=\"_blank\" rel=\"noopener\">iums.me/8524</a>)؛ المجلس الأوروبي للإفتاء والبحوث الإسلامية؛ المجمع الفقهي الإسلامي لرابطة العالم الإسلامي، دار الإفتاء المصرية، ١٩٤٤."
faq_a1b_p5 = "ولأيّ سؤال يخصّ حالتك بعينها، فإنّ الإمام فضيلة الشيخ سمير رضوان الجلاصي رهن إشارة الجالية المسلمة."

faq_q2 = "هل يمكنني التبرّع بشكل دوري؟"
faq_a2_p1 = "نعم، وهي بالنسبة لنا أثمن صورة. في تبويب «بطاقة» يمكنك أن تختار تحويل تبرّعك إلى <strong>دوريّ شهريّ</strong>. والتبرّع الدوريّ يدخل بأمان في خطّتنا — وهذا، بالنسبة لنا كمَن يخطّط، أثمن من تبرّعٍ كبير لمرّة واحدة لا يمكننا توقّعه."
faq_a2_p2 = "والتبرّع الدوريّ هو صورة كلاسيكية من <strong>الصدقة الجارية</strong>: يستمرّ في إيتاء ثماره شهراً بعد شهر، دون أن تفعل شيئاً."
faq_a2_p3 = "يمكنك إلغاؤه في أيّ لحظة، دون أسئلة."

faq_q3 = "هل يمكنني التبرّع باسم متوفّى؟"
faq_a3_p1 = "نعم. وهي من أنبل صور الصدقة الجارية. قال النبيّ ﷺ: <em>«إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم يُنتفع به، أو ولد صالح يدعو له.»</em> (مسلم)."
faq_a3_p2 = "عند التبرّع بالبطاقة، أو في خانة السبب في التحويل البنكي، أو في ملاحظات التبرّع، يمكنك أن تكتب <em>«تخليداً لذكرى [الاسم]»</em>. سيحتفظ مجلس LMT بسجلٍّ خاصٍّ بالأسماء وسيدعو لهم عند افتتاح المركز. لن يُنشَر أيّ اسم دون إذن صريح من العائلة."

faq_q4 = "هل تبرّعي قابل للخصم الضريبي؟"
faq_a4_p1_pre = "<bdi>Lega dei Musulmani in Ticino (LMT)</bdi> مسجَّلة في السجلّ التجاري منذ 20 يونيو 2005 برقم "
faq_a4_p1_post = "، ومعفاة من الضرائب الكانتونية والفيدرالية <strong>على دخلها</strong> منذ 13 مارس 2014."
faq_a4_p2 = "<strong>نحن نتحقّق</strong> ممّا إذا كانت الإعفاء نفسه يمتدّ إلى قابلية خصم التبرّعات الفردية للمتبرّع. هذا تحقّق منفصل عن إعفاء الجمعية ويتطلّب تأكيداً رسمياً من السلطات الضريبية. سنحدّث هذه الصفحة بمجرّد أن يصلنا الردّ المكتوب."
faq_a4_p3 = "للمتبرّعين من إيطاليا وفرنسا وألمانيا: قابلية الخصم تعتمد على تشريعات بلدك وعلى الاتفاقيات الثنائية مع سويسرا. احتفظ بالإيصال التلقائي الذي يصلك عبر البريد الإلكتروني — هذا هو المستند الذي تحتاجه عند تقديم الإقرار."

faq_q5 = "متى ستفتح دار السلام؟"
faq_a5_p1 = "المراحل بالترتيب. قبل <strong>15 سبتمبر 2026</strong> نُغلق جمع تبرّعات المرحلة 1 (الأرض + التراخيص). من سبتمبر 2026 إلى نهاية 2027 تُودَع تراخيص البناء ويُبحَث عن التغطية المالية للمرحلة 2. اعتباراً من بداية 2027 — <em>إن شاء الله</em> — يبدأ البناء. مدّة البناء التقديرية حوالي ثمانية عشر شهراً."
faq_a5_p2 = "بشكل واقعيّ، يُتوقَّع افتتاح المركز <strong>بين 2028 و 2029</strong>."
faq_a5_p3 = "جميع التحديثات بشأن المراحل تُنشَر أسبوعياً على هذه الصفحة وشهرياً في التقرير العامّ."

faq_q6 = "وماذا لو لم نُغلق جمع التبرّعات قبل 15 سبتمبر؟"
faq_a6_p1 = "الإجابة الصادقة: تظلّ الأرض لنا حتى انتهاء المهلة المتّفق عليها مع البائع، لكنّنا نخاطر بفقدان حقّ الشراء وبالعودة إلى البحث من جديد. لذلك المهلة ليست رمزية — هي حقيقية."
faq_a6_p2 = "في كلّ الأحوال، <strong>كلّ فرنك تمّ التبرّع به سيدخل في الحساب المخصَّص</strong> (<bdi>IBAN PostFinance</bdi>، وهو منفصل عن الإدارة الجارية لـ <bdi>LMT</bdi>)، ويُستخدم حصراً لمشروع دار السلام."
faq_a6_p3 = "مسؤوليّتنا تجاه مَن يتبرّع تأتي قبل تقويمنا."

faq_q7 = "هل يمكنني زيارة المسجد الحالي في Viganello (Lugano)؟"
faq_a7_p1 = "نعم، نحن في انتظارك. مسجد رابطة مسلمي تيتشينو مفتوح طوال اليوم، وغالباً في الليل أيضاً. يمكنك أن تجدنا مجتمعين في أوقات الصلاة — أفضل لحظة لمعرفة مَن نحن هي يوم الجمعة، عند صلاة الجمعة، حين تكون الجالية مجتمعة."
faq_a7_p2_pre = "<strong>العنوان:</strong> "
faq_a7_p3 = "إذا كنت تفضّل لقاءً خاصّاً للتحدّث عن المشروع مع الرئيس أو مع المجلس أو الإمام، اكتب إلى"
faq_a7_p3_post = ". نردّ خلال 48 ساعة."

faq_q8 = "هل سأحصل على إيصال؟"
faq_a8_p1 = "للتبرّعات بالبطاقة و<bdi>Apple Pay</bdi> و<bdi>Google Pay</bdi>، يصل الإيصال تلقائياً عبر البريد الإلكتروني. للطرق الأخرى، إن لم تستلم الإيصال، اكتب إلى"
faq_a8_p1_post = "مع تاريخ التبرّع ومبلغه ونرسله إليك."
faq_a8_p2 = "جميع الإيصالات تحمل"
faq_a8_p2_post = "ومرجع الإعفاء الضريبي، صالحة لتقديم الإقرار."

