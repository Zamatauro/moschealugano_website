# ---------- FAQ ----------
faq_eyebrow = "الأسئلة الشائعة"
faq_h2 = "الأسئلة الأكثر تكراراً"

faq_q1 = "هل يمكنني دفع الزكاة لدار السلام؟"
faq_a1_p1 = "الجواب يعتمد على المذهب الذي تتّبعه. غالبية علماء المذاهب الأربعة الكلاسيكية (الحنفي، المالكي، الشافعي، الحنبلي) يعتبرون أنّ الزكاة موجَّهة في المقام الأول إلى الأصناف الثمانية المذكورة في سورة التوبة (60)، وأنّ بناء المساجد لا يدخل مباشرةً ضمنها. أمّا بعض العلماء المعاصرين فيوسّعون فئة <em>في سبيل الله</em> لتشملها."
faq_a1_p2 = "لتفادي أيّ التباس، نقترح عليك أن <strong>تخصّص لدار السلام صدقةً تطوّعية</strong> — لا زكاة — وأن تدفع زكاتك حسب رأي إمامك المرجعي أو حسب الجمعية التي تتعامل معها. والصدقة التطوّعية لمشروع كهذا يعتبرها جميع العلماء صدقة جارية."

faq_q2 = "هل يمكنني التبرّع بشكل دوري؟"
faq_a2_p1 = "نعم، وهي بالنسبة لنا أثمن صورة. في تبويب «بطاقة» يمكنك أن تختار تحويل تبرّعك إلى <strong>دوريّ شهريّ</strong>، حتى بـ20 فرنكاً فقط في الشهر. أربعة أشهر من تبرّع دوريّ بقيمة 20 فرنكاً تساوي ثمانين فرنكاً تدخل بأمان في خطّتنا — وهذا، بالنسبة لنا كمَن يخطّط، أثمن من تبرّعٍ كبير لمرّة واحدة لا يمكننا توقّعه."
faq_a2_p2 = "والتبرّع الدوريّ هو صورة كلاسيكية من <strong>الصدقة الجارية</strong>: يستمرّ في إيتاء ثماره شهراً بعد شهر، دون أن تفعل شيئاً."
faq_a2_p3 = "يمكنك إلغاؤه في أيّ لحظة، دون أسئلة."

faq_q3 = "هل يمكنني التبرّع باسم متوفّى؟"
faq_a3_p1 = "نعم. وهي من أنبل صور الصدقة الجارية. قال النبيّ ﷺ: <em>«إذا مات ابن آدم انقطع عمله إلا من ثلاث: صدقة جارية، أو علم يُنتفع به، أو ولد صالح يدعو له.»</em> (مسلم)."
faq_a3_p2 = "عند التبرّع بالبطاقة، أو في خانة السبب في التحويل البنكي، أو في ملاحظات التبرّع، يمكنك أن تكتب <em>«تخليداً لذكرى [الاسم]»</em>. سيحتفظ مجلس LMT بسجلٍّ خاصٍّ بالأسماء وسيدعو لهم عند افتتاح المركز. لن يُنشَر أيّ اسم دون إذن صريح من العائلة."

faq_q4 = "هل تبرّعي قابل للخصم الضريبي؟"
faq_a4_p1_pre = "Lega dei Musulmani in Ticino (LMT) مسجَّلة في السجلّ التجاري منذ 20 يونيو 2005 برقم "
faq_a4_p1_post = "، ومعفاة من الضرائب الكانتونية والفيدرالية <strong>على دخلها</strong> منذ 13 مارس 2014."
faq_a4_p2 = "<strong>نحن نتحقّق</strong> ممّا إذا كانت الإعفاء نفسه يمتدّ إلى قابلية خصم التبرّعات الفردية للمتبرّع. هذا تحقّق منفصل عن إعفاء الجمعية ويتطلّب تأكيداً رسمياً من السلطات الضريبية. سنحدّث هذه الصفحة بمجرّد أن يصلنا الردّ المكتوب."
faq_a4_p3 = "للمتبرّعين من إيطاليا وفرنسا وألمانيا: قابلية الخصم تعتمد على تشريعات بلدك وعلى الاتفاقيات الثنائية مع سويسرا. احتفظ بالإيصال التلقائي الذي يصلك عبر البريد الإلكتروني — هذا هو المستند الذي تحتاجه عند تقديم الإقرار."

faq_q5 = "متى ستفتح دار السلام؟"
faq_a5_p1 = "المراحل بالترتيب. قبل <strong>15 سبتمبر 2026</strong> نُغلق جمع تبرّعات المرحلة 1 (الأرض + التراخيص). من سبتمبر 2026 إلى نهاية 2027 تُودَع تراخيص البناء ويُبحَث عن التغطية المالية للمرحلة 2. اعتباراً من بداية 2027 — <em>إن شاء الله</em> — يبدأ البناء. مدّة البناء التقديرية حوالي ثمانية عشر شهراً."
faq_a5_p2 = "بشكل واقعيّ، يُتوقَّع افتتاح المركز <strong>بين 2028 و 2029</strong>."
faq_a5_p3 = "جميع التحديثات بشأن المراحل تُنشَر أسبوعياً على هذه الصفحة وشهرياً في التقرير العامّ."

faq_q6 = "وماذا لو لم نُغلق جمع التبرّعات قبل 15 سبتمبر؟"
faq_a6_p1 = "الإجابة الصادقة: تظلّ الأرض لنا حتى انتهاء المهلة المتّفق عليها مع البائع، لكنّنا نخاطر بفقدان حقّ الشراء وبالعودة إلى البحث من جديد. لذلك المهلة ليست رمزية — هي حقيقية."
faq_a6_p2 = "في كلّ الأحوال، <strong>يبقى كلّ فرنك تمّ التبرّع به في الحساب المخصَّص المنفصل</strong> (IBAN PostFinance منفصل عن الإدارة الجارية لـ LMT)، ويُستخدم حصراً لمشروع دار السلام. إذا لم تُغلق المرحلة 1 في الوقت المناسب، سيُبلِغ مجلس LMT المجتمع بكيفية المضيّ قدماً، بشفافية تامّة."
faq_a6_p3 = "مسؤوليّتنا تجاه مَن يتبرّع تأتي قبل تقويمنا."

faq_q7 = "هل يمكنني زيارة المسجد الحالي في بوتونيو؟"
faq_a7_p1 = "نعم، نحن في انتظارك. مسجد بوتونيو مفتوح طوال اليوم، وغالباً في الليل أيضاً. يمكنك أن تجدنا مجتمعين في أوقات الصلاة — أفضل لحظة لفهم مَن نحن هي يوم الجمعة، عند صلاة الجمعة، حين يكون المجتمع كلّه حاضراً."
faq_a7_p2_pre = "<strong>العنوان:</strong> "
faq_a7_p3 = "إذا كنت تفضّل لقاءً خاصّاً للتحدّث عن المشروع مع الرئيس أو مع المجلس، اكتب إلى"
faq_a7_p3_post = ". نردّ خلال 48 ساعة."

faq_q8 = "هل سأحصل على إيصال؟"
faq_a8_p1 = "للتبرّعات بالبطاقة وApple Pay وGoogle Pay، يصل الإيصال تلقائياً عبر البريد الإلكتروني. للطرق الأخرى، إن لم تستلم الإيصال، اكتب إلى"
faq_a8_p1_post = "مع تاريخ التبرّع ومبلغه ونرسله إليك."
faq_a8_p2 = "جميع الإيصالات تحمل"
faq_a8_p2_post = "ومرجع الإعفاء الضريبي، صالحة لتقديم الإقرار."

# ---------- TRASPARENZA ----------
trasp_eyebrow = "الشفافية"
trasp_h2 = "المستندات والحوكمة والحساب المخصَّص"

trasp_body_p1_pre = "<a href=\"https://islam-lugano.ch/\" target=\"_blank\" rel=\"noopener\">Lega dei Musulmani in Ticino</a> مسجَّلة في السجلّ التجاري لكانتون تيتشينو منذ 20 يونيو 2005 برقم "
trasp_body_p1_post = ". وهي معفاة من الضرائب الكانتونية والفيدرالية على دخلها منذ 13 مارس 2014، وفقاً للمادة 65 الفقرة (g) من قانون الضرائب الكانتوني والمادة 56 الفقرة (h) من قانون الضرائب الفيدرالي LIFD."
trasp_body_p2 = "اللجنة الحالية انتُخبت في 23 يناير 2019. الرئيس وأمين الصندوق هو <strong>سمير جمعة (Samir Gomaa)</strong> (توقيع منفرد). نائب الرئيس <strong>رضوان الجلاصي (Radouan Jelassi)</strong>. عضو وأمين السرّ <strong>عدنان الحريري (Adnan Al Hariri)</strong>."
trasp_body_p3 = "تتدفّق التبرّعات لحملة دار السلام إلى <strong>حساب IBAN PostFinance مخصَّص ومنفصل</strong> عن الإدارة الجارية للجمعية، باسم Lega dei Musulmani in Ticino مع سبب مخصَّص \"Progetto Nuova Moschea\". جميع الحركات قابلة للتتبّع والتدقيق."
trasp_body_p4 = "تقرير الجمع يُنشَر أسبوعياً على هذه الصفحة. والميزانية السنوية الكاملة للجمعية مودَعة ومتاحة."
