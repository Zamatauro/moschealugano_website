# ---------- PERCHE ORA ----------
perche_eyebrow = "Warum jetzt"
perche_h2 = "Eine Tür hat sich geöffnet"

# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Zwanzig Jahre lang beten wir nun in hundert Quadratmetern in Viganello (Lugano). Seit zwanzig Jahren sind wir Gäste: der Saal, in dem wir beten, gehört uns nicht, wir mieten ihn Monat für Monat, ohne die Gewissheit, dass er morgen noch da sein wird. Die Gemeinschaft ist gewachsen, der Raum nicht."
perche_v2_p2 = "<strong>Ihn offen zu halten hat uns rund CHF 400'000 an Miete gekostet.</strong> Geld, das die Lichter brennen liess, aber niemals zu unserem Zuhause wurde."
perche_v2_p3 = "Dieses Jahr hat Allah uns eine Tür geöffnet. In Pregassona, an der Via Ceresio 53B, gibt es ein Grundstück, <strong>das wir endlich kaufen können</strong>. Wir haben es <strong>Dar al-Salam — ein neues Haus des Friedens</strong> genannt."
perche_v2_p4 = "<strong>Wir haben Zeit bis zum 15. September.</strong> Was fehlt, müssen wir gemeinsam sammeln. Jeder Franken, den du heute spendest, ist <strong>Sadaqa Jariya</strong> — ein Werk, das weiter Früchte trägt, jedes Mal wenn ein Kind in jenem Saal den Quran lernt, jedes Mal wenn ein Bruder Taraweeh betet, jedes Mal wenn eine Schwester in Not jemanden findet, der ihr zuhört."
perche_p1 = "Seit zwanzig Jahren beten wir auf hundert Quadratmetern in Viganello (Lugano)."
perche_p2 = "Ein gemieteter Saal hinter einer Tür, die in Lugano niemand kennt. Dort wissen jeden Freitag siebentausend Muslime im Tessin, dass sie für die Jumu'a einkehren können. Dort lehrt unsere Sonntagsschule El Nur das Alif-Ba an etwa dreissig Kinder, italienischsprachige Kinder, geboren in Lugano. Dort brechen wir gemeinsam das Fasten im Monat Ramadan, dort verrichten wir die Janazah, wenn ein Bruder zu Allah zurückkehrt, dort empfangen wir die Brüder und Schwestern, die im Tessin ankommen und noch kein Zuhause haben."
perche_p3_pre = "Um diesen Saal aufrechtzuerhalten, haben wir in zwanzig Jahren rund "
perche_p3_strong = "CHF 400'000 Miete"
perche_p3_post = " gezahlt. Geld, das jeden Monat einem Vermieter überwiesen wurde, ohne dass der Gemeinschaft etwas blieb."
perche_p5_pre = "Dieses Jahr hat Allah uns eine Tür geöffnet. In "
perche_p5_strong = "Pregassona, an der Via Ceresio 53B"
perche_p5_post = ", gibt es eine Parzelle. Sie gehört uns. Wir haben sie zusammen mit dem Architekturbüro Beier Cabrini gekauft, das das Projekt bereits ausgearbeitet hat: Mehrzwecksaal, täglicher Gebetsraum, Schule, Büro und sechs Wohnungen darüber, die den Betrieb des Zentrums für immer finanzieren werden."
perche_p6_pre = "Wir haben es "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = " genannt."
perche_p7_pre = "Wir benötigen "
perche_p7_strong_pre = " bis zum 15. September 2026"
perche_p7_strong_post = ""
perche_p7_post = ", um den Grundstückskauf, das Projekt, die notarielle Beurkundung, die Maklergebühren und die Rechtskosten zu decken. Ein Teil davon ist bereits durch die Brüder und Schwestern abgedeckt, die in den letzten Jahren gespendet haben — CHF "
perche_p7_raised_post = ". Den Rest sammeln wir gemeinsam in den nächsten vier Monaten."
perche_p8_pre = "Jeder Franken, den du heute gibst, ist "
perche_p8_strong = "Sadaqa Jariya"
perche_p8_post = ": ein Werk, das Frucht trägt, jedes Mal wenn ein Kind in diesem Saal das Lesen des Quran lernt, jedes Mal wenn ein Bruder im Ramadan Taraweeh betet, jedes Mal wenn eine Schwester in Not Gehör findet."
perche_cta = "Spende deine Sadaqa →"

# ---------- VOCI ----------
voci_eyebrow = "Stimmen der Gemeinschaft"
voci_h2 = "Die Stimmen von Dar al-Salam"
voci_intro = "Es sind die Menschen, die diese Gemeinschaft seit zwanzig Jahren tragen. Der Präsident, der Imam, die Mütter der Sonntagsschule, die in Lugano geborenen jungen Menschen, die Älteren, die die Moschee öffneten, als die Gemeinschaft in Lugano noch aus einer Handvoll Familien bestand. Sie sind es, die in diesen Wochen den Mut fassen, vor die Kamera zu treten und zu erzählen, was Dar al-Salam sein wird."
voci_aria_label = "Stimmen der Gemeinschaft"
voci_prev_aria = "Vorherige Stimme"
voci_next_aria = "Nächste Stimme"
voci_dot_aria = "Zu Stimme gehen"
voci_dots_aria = "Position der Stimme"

voce1_quote = "«Als mein Vater nach Lugano kam, war die einzige Möglichkeit, zu Hause zu beten; ich konnte in Viganello (Lugano) mit einigen Dutzend Brüdern beten. Heute sind wir siebentausend im ganzen Tessin. Zwanzig Jahre später ist es Zeit, ein eigenes Zuhause zu haben.»"
voce1_attrib_name = "Samir Gomaa"
voce1_attrib_role = "Präsident, Lega dei Musulmani in Ticino"
voce1_alt = "Samir Gomaa, Präsident der Lega dei Musulmani in Ticino"
voce1_placeholder_label = "Foto folgt"

voce2_quote = "«Ein Haus für Allah zu bauen, ist Sadaqa Jariya — ein Werk, das bis zum Tag des Gerichts Früchte trägt, jedes Mal wenn ein Bruder darin betet, jedes Mal wenn ein Kind darin den Quran lernt.»"
voce2_attrib_name = "Sheikh Samir Jelassi"
voce2_attrib_role = "Imam der Gemeinschaft"
voce2_alt = "Sheikh Samir Jelassi, Imam der Lega dei Musulmani in Ticino"

voce3_quote = "«Unsere Jugendlichen sind viele und werden jedes Jahr mehr. Wir lernen eng zusammengedrängt, in Räumen, die für anderes gedacht waren. Dar al-Salam bedeutet für sie ein richtiger Klassenraum — ein Ort, um den Quran mit der Würde zu lernen, die sie verdienen.»"
voce3_attrib_name = "Anes"
voce3_attrib_role = "Erzieher"
voce3_alt = "Anes, Erzieher der Gemeinschaft"


# ---------- FAQ ----------
faq_eyebrow = "FAQ"
faq_h2 = "Häufig gestellte Fragen"

faq_q1 = "Kann ich Zakat für Dar al-Salam zahlen?"
faq_a1_p1 = "Ja, es ist zulässig, die Zakat einem Projekt wie Dar al-Salam zukommen zu lassen: Es fällt unter die koranische Kategorie <em>Fi sabilillah</em> — «auf dem Weg Allahs» — eine der acht Verwendungen der Zakat, die in der Sura at-Tawba (Vers 60) genannt werden."
faq_a1_p2 = "Diese Zulässigkeit ist von zahlreichen zeitgenössischen Gelehrten und von den islamischen Rechtsinstanzen bestätigt worden, die der Auffassung sind, dass die Errichtung und Gründung von Moscheen und islamischen Zentren unter diese Kategorie fällt, insbesondere wenn es um eine muslimische Minderheit geht, die ohne Zakat-Mittel ihre eigene Moschee nicht bauen könnte; und sie haben dies auch aufgrund der religiösen Notwendigkeit erlaubt — die Lage, in der sich die muslimische Gemeinschaft im Tessin, in der Schweiz, heute befindet."
faq_q1b = "Vertiefung — warum die Zakat für das Projekt Dar al-Salam gültig ist"
faq_a1b_p1 = "Der Edle Quran (Sura at-Tawba, Vers 60) hat acht Verwendungen der Zakat festgelegt, eine davon ist <em>Fi sabilillah</em>. Zur Bedeutung dieser Kategorie haben die Gelehrten drei Lesarten vorgebracht: eine, die sie auf den Kampf für Allah beschränkt, eine sehr weite, die sie auf jedes gute Werk ausdehnt, und eine mittlere — die als die richtige gilt —, die sie auf jede Anstrengung bezieht, die unternommen wird, um das Wort Allahs zu erhöhen; und ein wesentlicher Teil dieser Anstrengung ist die <em>Da'wah</em>, die Einladung zum Islam und seine Weitergabe, sowie die Wahrung des Gottesdienstes Allahs für die muslimische Minderheit."
faq_a1b_p2 = "Auf dieser Grundlage haben zeitgenössische Rechtsinstanzen entschieden, dass es zulässig ist, die Zakat für den Bau von Moscheen und islamischen Zentren in Ländern mit muslimischer Minderheit zu verwenden, da dies der Bewahrung der Religion der Gemeinschaft dient und zum Erhalt ihrer Identität beiträgt. Dies bestätigen die <strong>Fatwa der Internationalen Union Muslimischer Gelehrter</strong> — unterzeichnet von Prof. Dr. Ali Mohieddin Al-Qaradaghi, ihrem Generalsekretär und Vizepräsidenten des Europäischen Rates für Fatwa und Forschung — und der Beschluss des <strong>Islamischen Fiqh-Rates der Islamischen Weltliga</strong>. Es ist keine neue Position: Die Auslegung, wonach die Verwendung <em>Fi sabilillah</em> die guten Werke einschliesst, findet sich bereits in den alten Kommentaren, darunter dem von Fakhr al-Din al-Razi und Ibn al-Arabi; und 1944 erliess die ägyptische Dar al-Ifta eine ausdrückliche Fatwa über die Zulässigkeit, die Zakat für den Bau von Moscheen zu verwenden."
faq_a1b_p3 = "Ein wichtiger Punkt muss klargestellt werden: Diese Fatwas und juristischen Stellungnahmen betreffen die Moscheen und Zentren muslimischer Minderheiten. Für die Moscheen der Länder mit muslimischer Mehrheit hingegen erlaubt die Mehrheit der Rechtsgelehrten die Verwendung der Zakat für sie nicht. Dar al-Salam in Lugano, in der Schweiz, fällt vollständig in den ersten Fall: Es ist eines der Gotteshäuser einer muslimischen Minderheit, und nach zwanzig Jahren zur Miete sehen wir uns ausserstande — ohne diese Mittel und ohne diese Verwendung der Zakat — ein islamisches Zentrum zu bauen, in dem der Gottesdienst Allahs verrichtet wird."
faq_a1b_p4 = "Quellen: Internationale Union Muslimischer Gelehrter, Fatwa Nr. 8524 (<a href=\"https://iums.me/8524\" target=\"_blank\" rel=\"noopener\">iums.me/8524</a>); Europäischer Rat für Fatwa und Islamische Forschung; Islamischer Fiqh-Rat der Islamischen Weltliga; ägyptische Dar al-Ifta, 1944."
faq_a1b_p5 = "Für jede Frage zu deiner konkreten Situation steht Imam Sheikh Samir Radouan Jelassi der muslimischen Gemeinschaft zur Verfügung."

faq_q2 = "Kann ich eine wiederkehrende Spende einrichten?"
faq_a2_p1 = "Ja, und für uns ist dies die wertvollste Form. Im Tab «Karte» kannst du deine Spende in eine <strong>monatlich wiederkehrende</strong> umwandeln. Eine wiederkehrende Spende geht sicher in unseren Sammlungsplan ein — und für uns, die wir planen, ist das wertvoller als eine grosse einmalige Spende, die wir nicht voraussehen können."
faq_a2_p2 = "Eine wiederkehrende Spende ist zudem eine klassische Form der <strong>Sadaqa Jariya</strong>: Sie trägt Monat für Monat Frucht, ohne dass du etwas tun musst."
faq_a2_p3 = "Du kannst sie jederzeit kündigen, ohne Nachfragen."

faq_q3 = "Kann ich im Namen einer verstorbenen Person spenden?"
faq_a3_p1 = "Ja. Es ist eine der edelsten Formen der Sadaqa Jariya. Der Prophet (s.a.w.s) sagte: <em>«Wenn der Sohn Adams stirbt, hören seine Werke auf, ausser dreien — einer Sadaqa Jariya, einem nützlichen Wissen, das er hinterlassen hat, oder einem rechtschaffenen Kind, das für ihn Du'a macht.»</em> (Muslim)."
faq_a3_p2 = "Wenn du per Karte spendest, kannst du im Verwendungszweck der Überweisung, oder in den Spendennotizen, <em>«im Gedenken an [Name]»</em> schreiben. Der LMT-Vorstand führt ein privates Register der Namen und wird bei der Eröffnung des Zentrums Du'a für sie sprechen. Kein Name wird ohne ausdrückliche Zustimmung der Familie veröffentlicht."

faq_q4 = "Ist meine Spende steuerlich absetzbar?"
faq_a4_p1_pre = "Die Lega dei Musulmani in Ticino (LMT) ist seit dem 20. Juni 2005 unter der Nummer "
faq_a4_p1_post = " im Handelsregister eingetragen und seit dem 13. März 2014 von den Kantons- und Bundessteuern <strong>auf ihre Erträge</strong> befreit."
faq_a4_p2 = "<strong>Wir prüfen</strong>, ob sich dieselbe Befreiung auch auf die Abzugsfähigkeit der Einzelspenden für den Spender erstreckt. Das ist eine andere Prüfung als die Vereinsbefreiung und erfordert eine formelle Bestätigung der Steuerbehörden. Wir werden diese Seite aktualisieren, sobald wir die schriftliche Antwort haben."
faq_a4_p3 = "Für italienische, französische und deutsche Spender hängt die Abzugsfähigkeit von den Vorschriften deines Landes und den bilateralen Abkommen mit der Schweiz ab. Bewahre die automatische Quittung auf, die du per E-Mail erhältst — sie ist das Dokument, das du bei der Steuererklärung benötigst."

faq_q5 = "Wann wird Dar al-Salam eröffnet?"
faq_a5_p1 = "Die Etappen der Reihe nach. Bis zum <strong>15. September 2026</strong> schliessen wir die Spendensammlung der Phase 1 ab (Grundstück + Bewilligungen). Von September 2026 bis Ende 2027 werden die Baubewilligungen eingereicht und die finanzielle Deckung der Phase 2 gesucht. Ab Anfang 2027 — <em>insha'Allah</em> — beginnen die Bauarbeiten. Die geschätzte Bauzeit beträgt etwa achtzehn Monate."
faq_a5_p2 = "Realistisch ist die Eröffnung des Zentrums <strong>zwischen 2028 und 2029</strong> zu erwarten."
faq_a5_p3 = "Alle Aktualisierungen zu den Etappen werden wöchentlich auf dieser Landing Page und monatlich im öffentlichen Rechenschaftsbericht veröffentlicht."

faq_q6 = "Was passiert, wenn die Spendensammlung bis zum 15. September nicht abgeschlossen ist?"
faq_a6_p1 = "Die ehrliche Antwort: Die Parzelle bliebe bis zum Ablauf der mit dem Verkäufer vereinbarten Frist unsere, aber wir riskieren, das Kaufrecht zu verlieren und neu suchen zu müssen. Deshalb ist diese Frist nicht symbolisch — sie ist reell."
faq_a6_p2 = "In jedem Fall <strong>bleibt jeder gespendete Franken auf dem dafür eingerichteten Konto</strong> (PostFinance-IBAN, getrennt von der laufenden Verwaltung der LMT) und wird ausschliesslich für das Projekt Dar al-Salam verwendet. Sollte Phase 1 nicht rechtzeitig abgeschlossen werden, wird der LMT-Vorstand der Gemeinschaft in voller Transparenz mitteilen, wie weiter vorgegangen wird."
faq_a6_p3 = "Unsere Verantwortung gegenüber den Spenderinnen und Spendern steht vor unserem Kalender."

faq_q7 = "Kann ich die heutige Moschee in Viganello (Lugano) besuchen?"
faq_a7_p1 = "Ja, wir erwarten dich. Unsere Moschee ist den ganzen Tag geöffnet, oft auch nachts. Du findest uns zu den Gebetszeiten versammelt — der beste Moment, um zu verstehen, wer wir sind, ist der Freitag, zur Jumu'a, wenn die ganze Gemeinschaft anwesend ist."
faq_a7_p2_pre = "<strong>Adresse:</strong> "
faq_a7_p3 = "Wenn du einen privaten Termin bevorzugst, um mit dem Präsidenten oder dem Vorstand über das Projekt zu sprechen, schreib an"
faq_a7_p3_post = ". Wir antworten innerhalb von 48 Stunden."

faq_q8 = "Erhalte ich eine Quittung?"
faq_a8_p1 = "Bei Spenden mit Karte, Apple Pay und Google Pay kommt die Quittung automatisch per E-Mail. Bei den anderen Methoden, falls du sie nicht erhalten solltest, schreib an"
faq_a8_p1_post = "mit Datum und Betrag der Spende, und wir senden sie dir zu."
faq_a8_p2 = "Alle Quittungen tragen"
faq_a8_p2_post = "und den Verweis auf die Steuerbefreiung, gültig für die Steuererklärung."

