trasp_eyebrow = "Transparenz"
trasp_h2 = "Dokumente, Governance, zweckgebundenes Konto"

trasp_body_p1_pre = "Die <a href=\"https://islam-lugano.ch/\" target=\"_blank\" rel=\"noopener\">Lega dei Musulmani in Ticino</a> ist seit dem 20. Juni 2005 unter der Nummer "
trasp_body_p1_post = " im Handelsregister des Kantons Tessin eingetragen. Sie ist seit dem 13. März 2014 von den Kantons- und Bundessteuern auf ihre Erträge befreit, gemäss Art. 65 Abs. g des kantonalen Steuergesetzes und Art. 56 Abs. h des eidgenössischen DBG."
trasp_body_p2 = "Der derzeitige Vorstand wurde am 23. Januar 2019 gewählt. Präsident und Kassier ist <strong>Samir Gomaa</strong> (Einzelunterschrift). Vizepräsident: <strong>Samir Radouan Jelassi</strong>. Mitglied und Sekretär: <strong>Adnan Al Hariri</strong>."
trasp_body_p3 = "Die Spenden für die Kampagne Dar al-Salam fliessen auf ein <strong>zweckgebundenes PostFinance-IBAN-Konto, getrennt</strong> von der ordentlichen Vereinsführung, registriert auf die Lega dei Musulmani in Ticino, mit dem Verwendungszweck \"Progetto Nuova Moschea\". Alle Bewegungen sind nachvollziehbar und prüfbar."
trasp_body_p4 = "Der Spendenbericht wird wöchentlich auf dieser Seite veröffentlicht."
