# ---------- PERCHE ORA ----------
perche_eyebrow = "Why now"
perche_h2 = "A door has opened"

# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Twenty years praying in a hundred square metres in Bottogno. For twenty years we have been guests: the hall where we pray is not ours, we rent it month after month, with no certainty that it will still be there tomorrow. The community has grown, the space has not."
perche_v2_p2 = "<strong>Keeping it open has cost us around CHF 400'000 in rent.</strong> Money that has kept the lights on but has never become our home."
perche_v2_p3 = "This year Allah has opened a door for us. In Pregassona, at Via Ceresio 53B, there is a plot of land <strong>that we can finally buy</strong>. We have called it <strong>Dar al-Salam — a new house of peace</strong>."
perche_v2_p4 = "<strong>We have until 15 September.</strong> What is missing, we must raise together. Every franc you donate today is <strong>Sadaqa jariya</strong> — a deed that keeps bearing fruit every time a child learns the Quran in that hall, every time a brother prays Taraweeh, every time a sister in need finds someone to listen."
perche_p1 = "For twenty years we have prayed in a hundred square metres in Bottogno."
perche_p2 = "A rented hall, behind a door no one in Lugano knows. There, every Friday, seven thousand Muslims in Ticino know they can stop and perform Jumu'a. There our Sunday school El Nur teaches the alif-ba to about thirty children, Italian-speakers born in Lugano. There we break the fast together during Ramadan, there we pray the Janazah when a brother returns to Allah, there we welcome the brothers and sisters who arrive in Ticino and have not yet found a home."
perche_p3_pre = "To keep that hall open we have paid, over twenty years, around "
perche_p3_strong = "CHF 400'000 in rent"
perche_p3_post = ". Money handed over to a landlord, every month, with nothing left for the community."
perche_p5_pre = "This year Allah has opened a door for us. In "
perche_p5_strong = "Pregassona, at via Ceresio 53B"
perche_p5_post = ", there is a plot. It is ours. We bought it together with the studio of architect Beier Cabrini, who already has the project ready: a multi-purpose hall, a daily prayer hall, a school, an office, and six apartments above that will fund the running of the centre forever."
perche_p6_pre = "We have called it "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = "."
perche_p7_pre = "We need "
perche_p7_strong_pre = " by 15 September 2026"
perche_p7_strong_post = ""
perche_p7_post = " to close the land purchase, the project, the notary deed, the brokerage and the legal costs. Part of it is already covered by the brothers and sisters who have donated over the years — CHF "
perche_p7_raised_post = ". The rest we will raise together over the next four months."
perche_p8_pre = "Every franc you give today is "
perche_p8_strong = "Sadaqa jariya"
perche_p8_post = ": a deed that keeps bearing fruit every time a child learns to read the Quran in that hall, every time a brother prays Taraweeh in Ramadan, every time a sister in difficulty finds someone to listen."
perche_cta = "Give your Sadaqa →"

