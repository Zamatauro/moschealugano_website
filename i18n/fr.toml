# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Vingt ans que nous prions dans cent mètres carrés à Bottogno. Depuis vingt ans nous sommes des hôtes : la salle où nous prions n'est pas la nôtre, nous la louons mois après mois, sans la certitude qu'elle sera encore là demain. La communauté a grandi, l'espace non."
perche_v2_p2 = "<strong>La maintenir ouverte nous a coûté environ CHF 400'000 de loyer.</strong> De l'argent qui a gardé les lumières allumées, mais qui n'est jamais devenu notre maison."
perche_v2_p3 = "Cette année, Allah nous a ouvert une porte. À Pregassona, à la Via Ceresio 53B, il y a un terrain <strong>que nous pouvons enfin acheter</strong>. Nous l'avons appelé <strong>Dar al-Salam — une nouvelle maison de paix</strong>."
perche_v2_p4 = "<strong>Nous avons jusqu'au 15 septembre.</strong> Ce qui manque, nous devons le rassembler ensemble. Chaque franc que tu donnes aujourd'hui est <strong>sadaqa jariya</strong> — une œuvre qui continue à porter ses fruits chaque fois qu'un enfant apprendra le Coran dans cette salle, chaque fois qu'un frère priera taraweeh, chaque fois qu'une sœur en difficulté trouvera quelqu'un qui l'écoute."
perche_p1 = "Depuis vingt ans, nous prions dans cent mètres carrés à Bottogno."
perche_p2 = "Une salle louée, derrière une porte que personne à Lugano ne connaît. Là, chaque vendredi, sept mille musulmans du Tessin savent qu'ils peuvent s'arrêter pour la jumu'a. Là, notre école dominicale El Nur enseigne l'alif-ba à une trentaine d'enfants, italophones nés à Lugano. Là, nous rompons le jeûne ensemble pendant le mois de Ramadan, là, nous récitons la janazah lorsqu'un frère retourne à Allah, là, nous accueillons les sœurs et les frères qui arrivent au Tessin et n'ont pas encore de maison."
perche_p3_pre = "Pour maintenir cette salle, nous avons payé, en vingt ans, environ "
perche_p3_strong = "CHF 400'000 de loyer"
perche_p3_post = ". De l'argent versé chaque mois à un propriétaire, sans qu'il en reste rien à la communauté."
perche_beat = "Quatre cent mille francs. Les visages de nos enfants. Les mains de ceux qui ont préparé cent iftars."
perche_p5_pre = "Cette année, Allah nous a ouvert une porte. À "
perche_p5_strong = "Pregassona, à la via Ceresio 53B"
perche_p5_post = ", il y a une parcelle. Elle est à nous. Nous l'avons achetée avec le studio de l'architecte Beier Cabrini, dont le projet est déjà prêt : salle polyvalente, salle de prière quotidienne, école, bureau, six appartements au-dessus qui paieront le fonctionnement du centre pour toujours."
perche_p6_pre = "Nous l'avons appelée "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = "."
perche_claim = "Une nouvelle maison de paix."
perche_p7_pre = "Il nous faut "
perche_p7_strong_pre = " d'ici le 15 septembre 2026"
perche_p7_strong_post = ""
perche_p7_post = " pour conclure l'achat du terrain, le projet, l'acte notarié, l'intermédiation et les frais juridiques. Une partie est déjà couverte par les frères et les sœurs qui ont donné ces dernières années — CHF "
perche_p7_raised_post = ". Le reste, nous le collectons ensemble dans les quatre prochains mois."
perche_p8_pre = "Chaque franc que tu poses aujourd'hui est "
perche_p8_strong = "sadaqa jariya"
