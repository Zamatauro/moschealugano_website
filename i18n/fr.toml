# ---------- FAQ ----------
faq_eyebrow = "FAQ"
faq_h2 = "Questions fréquentes"

faq_q1 = "Puis-je payer la Zakat pour Dar al-Salam ?"
faq_a1_p1 = "Oui, il est licite de verser la Zakat à un projet comme Dar al-Salam : il relève de la catégorie coranique <em>Fi sabilillah</em> — « pour la voie d'Allah » — l'une des huit affectations de la Zakat indiquées dans la Sourate at-Tawba (verset 60)."
faq_a1_p2 = "Cette licéité a été confirmée par de nombreux savants contemporains et par les instances juridiques islamiques, qui considèrent que l'érection et la fondation de Mosquées et de centres islamiques relèvent de cette catégorie, en particulier lorsqu'il s'agit d'une minorité musulmane qui, sans les fonds de la Zakat, ne pourrait pas construire sa propre Mosquée ; et ils l'ont également autorisé au titre de la nécessité religieuse — la situation dans laquelle se trouve aujourd'hui la communauté musulmane au Tessin, en Suisse."
faq_q1b = "Pour aller plus loin — pourquoi la Zakat est valide pour le projet Dar al-Salam"
faq_a1b_p1 = "Le Noble Coran (Sourate at-Tawba, verset 60) a établi huit affectations de la Zakat, l'une d'elles étant <em>Fi sabilillah</em>. Sur le sens de cette catégorie, les savants ont proposé trois lectures : une qui la restreint à la lutte pour Allah, une très large qui l'étend à toute bonne œuvre, et une intermédiaire — celle qui est retenue — qui la rapporte à tout effort accompli pour élever la parole d'Allah ; et une part essentielle de cet effort est la <em>Da'wah</em>, l'appel à l'Islam et sa transmission, ainsi que l'accomplissement du culte d'Allah pour la minorité musulmane."
faq_a1b_p2 = "Sur cette base, des instances juridiques contemporaines ont établi qu'il est licite d'affecter la Zakat à la construction de Mosquées et de centres islamiques dans les pays à minorité musulmane, considérant que cela relève de la préservation de la religion de la communauté et contribue à préserver son identité. C'est ce que confirment la <strong>Fatwa de l'Union internationale des savants musulmans</strong> — signée par le Pr Dr Ali Mohieddin Al-Qaradaghi, son secrétaire général et vice-président du Conseil européen pour la Fatwa et la recherche — et la décision du <strong>Conseil de jurisprudence islamique de la Ligue islamique mondiale</strong>. Ce n'est pas une position nouvelle : l'extension selon laquelle l'affectation <em>Fi sabilillah</em> inclut les œuvres de bien figure déjà dans les commentaires anciens, parmi lesquels celui de Fakhr al-Din al-Razi et d'Ibn al-Arabi ; et en 1944 la Dar al-Ifta égyptienne a émis une Fatwa explicite sur la licéité d'affecter la Zakat à la construction des Mosquées."
faq_a1b_p3 = "Un point important doit être précisé : ces Fatwas et ces avis juridiques concernent les Mosquées et les centres des minorités musulmanes. Pour les Mosquées des pays à majorité musulmane, en revanche, la plupart des juristes n'admettent pas d'y affecter la Zakat. Dar al-Salam, à Lugano, en Suisse, relève pleinement du premier cas : c'est l'une des maisons de culte d'une minorité musulmane, et après vingt ans de location nous nous trouvons dans l'impossibilité — sans ces fonds et sans cette affectation de la Zakat — de construire un centre islamique où le culte d'Allah soit accompli."
faq_a1b_p4 = "Sources : Union internationale des savants musulmans, Fatwa n° 8524 (<a href=\"https://iums.me/8524\" target=\"_blank\" rel=\"noopener\">iums.me/8524</a>) ; Conseil européen pour la Fatwa et la recherche islamique ; Conseil de jurisprudence islamique de la Ligue islamique mondiale ; Dar al-Ifta égyptienne, 1944."
faq_a1b_p5 = "Pour toute question concernant ta situation particulière, l'Imam Cheikh Samir Radouan Jelassi est à la disposition de la communauté musulmane."

faq_q2 = "Puis-je faire un don récurrent ?"
faq_a2_p1 = "Oui, et c'est pour nous la forme la plus précieuse. Dans l'onglet « Carte » tu peux choisir de transformer ton don en <strong>don récurrent mensuel</strong>. Un don récurrent entre de manière sûre dans notre plan de collecte — pour nous qui planifions, c'est plus précieux qu'un grand don ponctuel que nous ne pouvons pas prévoir."
faq_a2_p2 = "Un don récurrent est en outre une forme classique de <strong>Sadaqa jariya</strong> : il continue à porter ses fruits mois après mois, sans que tu aies à faire quoi que ce soit."
faq_a2_p3 = "Tu peux l'annuler à tout moment, sans questions."

faq_q3 = "Puis-je donner au nom d'une personne défunte ?"
faq_a3_p1 = "Oui. C'est l'une des formes les plus nobles de Sadaqa jariya. Le Prophète (s.a.w.s) a dit : <em>« Lorsque le fils d'Adam meurt, ses œuvres s'interrompent sauf pour trois choses — une Sadaqa jariya, une connaissance utile laissée en héritage, ou un enfant pieux qui fait Du'a pour lui. »</em> (Muslim)."
faq_a3_p2 = "Quand tu donnes par carte, dans le motif du virement ou dans les notes du don, tu peux écrire <em>« en mémoire de [nom] »</em>. Le conseil de la LMT tiendra un registre privé des noms et fera Du'a pour eux lors de l'ouverture du centre. Aucun nom ne sera publié sans le consentement explicite de la famille."

faq_q4 = "Mon don est-il déductible fiscalement ?"
faq_a4_p1_pre = "La Lega dei Musulmani in Ticino (LMT) est inscrite au Registre du commerce depuis le 20 juin 2005 sous le n° "
faq_a4_p1_post = ", et elle est exonérée des impôts cantonaux et fédéraux <strong>sur ses propres revenus</strong> depuis le 13 mars 2014."
faq_a4_p2 = "<strong>Nous vérifions</strong> si la même exonération s'étend à la déductibilité des dons individuels pour le donateur. Il s'agit d'une vérification distincte de l'exonération de l'association et qui requiert une confirmation formelle des autorités fiscales. Nous mettrons à jour cette page dès que nous aurons la réponse écrite."
faq_a4_p3 = "Pour les donateurs italiens, français, allemands : la déductibilité dépend de la législation de ton pays et des accords bilatéraux avec la Suisse. Conserve le reçu automatique que tu reçois par e-mail — c'est le document dont tu auras besoin lors de la déclaration."

faq_q5 = "Quand Dar al-Salam ouvrira-t-il ?"
faq_a5_p1 = "Les étapes dans l'ordre. D'ici au <strong>15 septembre 2026</strong> nous bouclons la collecte de la Phase 1 (terrain + permis). De septembre 2026 à fin 2027 les permis de construire sont déposés et la couverture financière de la Phase 2 est recherchée. À partir du début 2027 — <em>insha'Allah</em> — le chantier commence. La durée estimée de la construction est d'environ dix-huit mois."
faq_a5_p2 = "De manière réaliste, l'ouverture du centre est prévue <strong>entre 2028 et 2029</strong>."
faq_a5_p3 = "Toutes les mises à jour sur les étapes sont publiées chaque semaine sur cette page d'accueil et chaque mois dans le rapport public."

faq_q6 = "Et si nous ne bouclions pas la collecte avant le 15 septembre ?"
faq_a6_p1 = "La réponse honnête : la parcelle resterait à nous jusqu'à l'expiration du délai convenu avec le vendeur, mais nous risquerions de perdre le droit d'achat et de devoir recommencer la recherche. C'est pourquoi cette échéance n'est pas symbolique — elle est réelle."
faq_a6_p2 = "Dans tous les cas, <strong>chaque franc donné reste sur le compte dédié séquestré</strong> (IBAN PostFinance séparé de la gestion ordinaire de la LMT) et il est utilisé exclusivement pour le projet Dar al-Salam. Si la Phase 1 ne se bouclait pas à temps, le conseil de la LMT communiquerait à la communauté la marche à suivre, en toute transparence."
faq_a6_p3 = "Notre responsabilité envers ceux qui donnent passe avant notre calendrier."

faq_q7 = "Puis-je visiter la Mosquée actuelle à Viganello (Lugano) ?"
faq_a7_p1 = "Oui, nous t'attendons. Notre Mosquée est ouverte toute la journée, souvent la nuit également. Tu peux nous trouver réunis aux heures de prière — le meilleur moment pour comprendre qui nous sommes est le vendredi, à la Jumu'a, lorsque la communauté est au complet."
faq_a7_p2_pre = "<strong>Adresse :</strong> "
faq_a7_p3 = "Si tu préfères un rendez-vous privé pour parler du projet avec le président ou le conseil, écris à"
faq_a7_p3_post = ". Nous répondons sous 48 heures."

faq_q8 = "Vais-je recevoir un reçu ?"
faq_a8_p1 = "Pour les dons par carte, Apple Pay et Google Pay, le reçu arrive automatiquement par e-mail. Pour les autres modes, si tu ne le reçois pas, écris à"
