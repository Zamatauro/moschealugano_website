voce2_quote = "« Construire une maison pour Allah est Sadaqa jariya — une œuvre qui continue à porter ses fruits jusqu'au Jour du Jugement, chaque fois qu'un frère y prie, chaque fois qu'un enfant y apprend le Coran. »"
voce2_attrib_name = "Cheikh Samir Jelassi"
voce2_attrib_role = "Imam de la communauté"
