# ---------- FAQ ----------
faq_eyebrow = "FAQ"
faq_h2 = "Questions fréquentes"
faq_title = "Questions fréquentes"

faq_q1 = "Puis-je payer la zakat pour Dar al-Salam ?"
faq_a1_p1 = "La réponse dépend de l'école juridique à laquelle tu te réfères. La majorité des oulémas des quatre écoles classiques (Hanafi, Maliki, Shafi'i, Hanbali) considèrent que la zakat est destinée en premier lieu aux huit catégories indiquées dans la Sourate at-Tawba (60), et que la construction de mosquées n'en relève pas directement. Certains oulémas contemporains étendent en revanche la catégorie <em>fi sabilillah</em> pour l'inclure."
faq_a1_p2 = "Pour éviter toute ambiguïté, nous te suggérons de <strong>destiner à Dar al-Salam une sadaqa volontaire</strong> — pas la zakat — et de payer ta zakat selon l'avis de ton imam de référence ou selon l'organisation que tu utilises déjà. Une sadaqa volontaire pour un projet comme celui-ci est considérée par tous les oulémas comme une forme de sadaqa jariya."

faq_q2 = "Puis-je faire un don récurrent ?"
faq_a2_p1 = "Oui, et c'est pour nous la forme la plus précieuse. Dans l'onglet « Carte » tu peux choisir de transformer ton don en <strong>don récurrent mensuel</strong>, même de seulement CHF 20 par mois. Quatre mois de dons récurrents de CHF 20 représentent CHF 80 qui entrent de manière sûre dans notre plan de collecte — pour nous qui planifions, c'est plus précieux qu'un grand don ponctuel que nous ne pouvons pas prévoir."
faq_a2_p2 = "Un don récurrent est en outre une forme classique de <strong>sadaqa jariya</strong> : il continue à porter ses fruits mois après mois, sans que tu aies à faire quoi que ce soit."
faq_a2_p3 = "Tu peux l'annuler à tout moment, sans questions."

faq_q3 = "Puis-je donner au nom d'une personne défunte ?"
faq_a3_p1 = "Oui. C'est l'une des formes les plus nobles de sadaqa jariya. Le Prophète (s.a.w.s) a dit : <em>« Lorsque le fils d'Adam meurt, ses œuvres s'interrompent sauf pour trois choses — une sadaqa jariya, une connaissance utile laissée en héritage, ou un enfant pieux qui fait du'a pour lui. »</em> (Muslim)."
faq_a3_p2 = "Quand tu donnes par carte, dans le motif du virement ou dans les notes du don, tu peux écrire <em>« en mémoire de [nom] »</em>. Le conseil de la LMT tiendra un registre privé des noms et fera du'a pour eux lors de l'ouverture du centre. Aucun nom ne sera publié sans le consentement explicite de la famille."

faq_q4 = "Mon don est-il déductible fiscalement ?"
faq_a4_p1_pre = "La Lega dei Musulmani in Ticino (LMT) est inscrite au Registre du commerce depuis le 20 juin 2005 sous le n° "
faq_a4_p1_post = ", et elle est exonérée des impôts cantonaux et fédéraux <strong>sur ses propres revenus</strong> depuis le 13 mars 2014."
faq_a4_p2 = "<strong>Nous vérifions</strong> si la même exonération s'étend à la déductibilité des dons individuels pour le donateur. Il s'agit d'une vérification distincte de l'exonération de l'association et qui requiert une confirmation formelle des autorités fiscales. Nous mettrons à jour cette page dès que nous aurons la réponse écrite."
faq_a4_p3 = "Pour les donateurs italiens, français, allemands : la déductibilité dépend de la législation de ton pays et des accords bilatéraux avec la Suisse. Conserve le reçu automatique que tu reçois par e-mail — c'est le document dont tu auras besoin lors de la déclaration."

faq_q5 = "Quand Dar al-Salam ouvrira-t-il ?"
faq_a5_p1 = "Les étapes dans l'ordre. D'ici au <strong>15 septembre 2026</strong> nous bouclons la collecte de la Phase 1 (terrain + permis). De septembre 2026 à fin 2027 les permis de construire sont déposés et la couverture financière de la Phase 2 est recherchée. À partir du début 2027 — <em>insha'Allah</em> — le chantier commence. La durée estimée de la construction est d'environ dix-huit mois."
faq_a5_p2 = "De manière réaliste, l'ouverture du centre est prévue <strong>entre 2028 et 2029</strong>."
faq_a5_p3 = "Toutes les mises à jour sur les étapes sont publiées chaque semaine sur cette page d'accueil et chaque mois dans le rapport public."

faq_q6 = "Et si nous ne bouclions pas la collecte avant le 15 septembre ?"
faq_a6_p1 = "La réponse honnête : la parcelle resterait à nous jusqu'à l'expiration du délai convenu avec le vendeur, mais nous risquerions de perdre le droit d'achat et de devoir recommencer la recherche. C'est pourquoi cette échéance n'est pas symbolique — elle est réelle."
faq_a6_p2 = "Dans tous les cas, <strong>chaque franc donné reste sur le compte dédié séquestré</strong> (IBAN PostFinance séparé de la gestion ordinaire de la LMT) et il est utilisé exclusivement pour le projet Dar al-Salam. Si la Phase 1 ne se bouclait pas à temps, le conseil de la LMT communiquerait à la communauté la marche à suivre, en toute transparence."
faq_a6_p3 = "Notre responsabilité envers ceux qui donnent passe avant notre calendrier."

faq_q7 = "Puis-je visiter la mosquée actuelle à Bottogno ?"
faq_a7_p1 = "Oui, nous t'attendons. La mosquée de Bottogno est ouverte toute la journée, souvent la nuit également. Tu peux nous trouver réunis aux heures de prière — le meilleur moment pour comprendre qui nous sommes est le vendredi, à la jumu'a, lorsque la communauté est au complet."
faq_a7_p2_pre = "<strong>Adresse :</strong> "
faq_a7_p3 = "Si tu préfères un rendez-vous privé pour parler du projet avec le président ou le conseil, écris à"
faq_a7_p3_post = ". Nous répondons sous 48 heures."

faq_q8 = "Vais-je recevoir un reçu ?"
faq_a8_p1 = "Pour les dons par carte, Apple Pay et Google Pay, le reçu arrive automatiquement par e-mail. Pour les autres modes, si tu ne le reçois pas, écris à"
faq_a8_p1_post = "en indiquant la date et le montant du don, et nous te l'envoyons."
faq_a8_p2 = "Tous les reçus portent"
faq_a8_p2_post = "et la référence de l'exonération fiscale, valides pour la déclaration des revenus."

