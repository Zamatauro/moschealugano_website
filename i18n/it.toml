perche_p2 = "Una sala in affitto, dietro una porta che a Lugano nessuno conosce. Lì, ogni venerdì, settemila musulmani in Ticino sanno che possono fermarsi a pregare la Jumu'a. Lì la nostra scuola domenicale El Nur insegna l'alif-ba a una trentina di bambini, italofoni nati a Lugano. Lì spezziamo il digiuno insieme nel mese di Ramadan, lì preghiamo la Janazah quando un fratello torna ad Allah, lì accogliamo le sorelle e i fratelli che arrivano in Ticino e non hanno ancora una casa."
perche_p3_pre = "Per tenere in piedi quella sala abbiamo pagato, in vent'anni, circa "
