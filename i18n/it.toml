# ---------- FAQ ----------
faq_eyebrow = "FAQ"
faq_h2 = "Domande frequenti"

faq_q1 = "Posso pagare la Zakat per Dar al-Salam?"
faq_a1_p1 = "Sì, è lecito pagare la Zakat a un progetto come Dar al-Salam: esso rientra nella categoria coranica <em>Fi sabilillah</em> — «per la via di Allah» — una delle otto destinazioni della Zakat indicate nella Sura at-Tawba (versetto 60)."
faq_a1_p2 = "Questa liceità è stata confermata da numerosi sapienti contemporanei e dalle istanze giuridiche islamiche, le quali considerano che l'erezione e la fondazione di Moschee e centri islamici rientri in questa categoria, in modo particolare quando si tratta di una minoranza musulmana che, senza i fondi della Zakat, non riuscirebbe a costruire la propria Moschea; e l'hanno permesso anche in virtù della necessità religiosa — la condizione in cui si trova oggi la comunità musulmana in Ticino, in Svizzera."
faq_q1b = "Approfondimento — perché la Zakat è valida per il progetto Dar al-Salam"
faq_a1b_p1 = "Il Nobile Corano (Sura at-Tawba, versetto 60) ha stabilito otto destinazioni della Zakat, una delle quali è <em>Fi sabilillah</em>. Sul significato di questa categoria i sapienti hanno espresso tre letture: una che la restringe alla lotta per Allah, una molto ampia che la estende a ogni opera buona, e una intermedia — quella prescelta — che la riferisce a ogni sforzo compiuto per elevare la parola di Allah; e parte essenziale di questo sforzo è la <em>Da'wah</em>, l'invito all'Islam e la sua trasmissione, e l'osservanza del culto di Allah per la minoranza musulmana."
faq_a1b_p2 = "Su questa base, istanze giuridiche contemporanee hanno stabilito che è lecito destinare la Zakat alla costruzione di Moschee e centri islamici nei paesi a minoranza musulmana, ritenendo che ciò rientri nella preservazione della religione della comunità e contribuisca a preservarne l'identità. Lo confermano la <strong>Fatwa dell'Unione Mondiale degli Studiosi Musulmani</strong> — a firma del Prof. Dr. Ali Mohieddin Al-Qaradaghi, suo Segretario Generale e Vicepresidente del Consiglio Europeo per la Fatwa e la Ricerca — e la decisione del <strong>Consiglio di Fiqh della Lega Mondiale Musulmana</strong>. Non è una posizione nuova: l'estensione del concetto secondo cui la destinazione <em>Fi sabilillah</em> include le opere di bene è presente nei commentari antichi, tra cui quello di Fakhr al-Din al-Razi e di Ibn al-Arabi; e nel 1944 la Dar al-Ifta egiziana emise una Fatwa esplicita sulla liceità di destinare la Zakat alla costruzione delle Moschee."
faq_a1b_p3 = "Va precisato un punto importante: queste Fatwe e questi pareri giuridici riguardano le Moschee e i centri delle minoranze musulmane. Per le Moschee dei paesi a maggioranza musulmana, invece, la maggior parte dei giuristi non ammette di destinarvi la Zakat. Dar al-Salam, a Lugano, in Svizzera, rientra pienamente nel primo caso: è una delle case di culto di una minoranza musulmana, e dopo vent'anni in affitto ci troviamo a non poter costruire — senza questi fondi e senza questa destinazione della Zakat — un centro islamico in cui si osservi il culto di Allah."
faq_a1b_p4 = "Fonti: Unione Mondiale degli Studiosi Musulmani, Fatwa n. 8524 (<a href=\"https://iums.me/8524\" target=\"_blank\" rel=\"noopener\">iums.me/8524</a>); Consiglio Europeo per la Fatwa e la Ricerca Islamica; Consiglio di Fiqh della Lega Mondiale Musulmana; Dar al-Ifta egiziana, 1944."
faq_a1b_p5 = "Per qualunque domanda riguardante la tua situazione specifica, l'Imam Sheikh Samir Radouan Jelassi è a disposizione della comunità musulmana."

faq_q2 = "Posso fare una donazione ricorrente?"
faq_a2_p1 = "Sì, e per noi è la forma più preziosa. Sul tab \"Carta\" puoi scegliere di trasformare la tua donazione in <strong>ricorrente mensile</strong>. Una donazione ricorrente entra sicura nel piano di raccolta — per noi che pianifichiamo, è più preziosa di una grande donazione una tantum che non possiamo prevedere."
faq_a2_p2 = "Una donazione ricorrente è inoltre una forma classica di <strong>Sadaqa jariya</strong>: continua a portare frutto mese dopo mese, senza che tu debba fare niente."
faq_a2_p3 = "Puoi cancellarla in qualunque momento, senza domande."

faq_q3 = "Posso donare in nome di un defunto?"
faq_a3_p1 = "Sì. È una delle forme più nobili di Sadaqa jariya. Il Profeta (s.a.w.s) ha detto: <em>«Quando il figlio di Adamo muore, le sue opere si interrompono salvo per tre cose — una Sadaqa jariya, una conoscenza utile lasciata in eredità, o un figlio pio che fa Du'a per lui.»</em> (Muslim)."
faq_a3_p2 = "Quando doni con carta, nella causale del bonifico o nelle note della donazione, puoi scrivere <em>«in memoria di [nome]»</em>. Il consiglio LMT terrà un registro privato dei nomi e farà Du'a per loro durante l'apertura del centro. Nessun nome verrà pubblicato senza permesso esplicito della famiglia."

faq_q4 = "La mia donazione è deducibile fiscalmente?"
faq_a4_p1_pre = "La Lega dei Musulmani in Ticino è iscritta al Registro di commercio dal 20 giugno 2005 con n. "
faq_a4_p1_post = ", ed è esente dalle imposte cantonali e federali <strong>sui propri redditi</strong> dal 13 marzo 2014."
faq_a4_p2 = "<strong>Stiamo verificando</strong> se la stessa esenzione si estende alla deducibilità delle singole donazioni per il donatore. È una verifica diversa dall'esenzione dell'associazione e richiede conferma formale dalle autorità fiscali. Aggiorneremo questa pagina appena avremo la risposta scritta."
faq_a4_p3 = "Per donatori italiani, francesi, tedeschi: la deducibilità dipende dalla normativa del tuo paese e dagli accordi bilaterali con la Svizzera. Conserva la ricevuta automatica che ricevi via email — è il documento che ti serve quando faremo la dichiarazione."

faq_q5 = "Quando aprirà Dar al-Salam?"
faq_a5_p1 = "Le tappe in ordine. Entro <strong>15 settembre 2026</strong> chiudiamo la raccolta della Fase 1 (terreno + permessi). Da settembre 2026 a fine 2027 si depositano i permessi di costruzione e si cerca la copertura finanziaria della Fase 2. Da inizio 2027 in avanti — <em>insha'Allah</em> — comincia il cantiere. La durata stimata della costruzione è di circa diciotto mesi."
faq_a5_p2 = "Realisticamente l'apertura del centro è prevista <strong>fra il 2028 e il 2029</strong>."
faq_a5_p3 = "Tutti gli aggiornamenti sulle tappe sono pubblicati settimanalmente in questa landing e mensilmente nel rendiconto pubblico."

faq_q6 = "E se non chiudessimo la raccolta entro il 15 settembre?"
faq_a6_p1 = "La risposta sincera: la particella resterebbe nostra fino allo scadere del termine concordato col venditore, ma rischieremmo di perdere il diritto di acquisto e di tornare a cercare. Per questo la scadenza non è simbolica — è reale."
faq_a6_p2 = "In ogni caso, <strong>ogni franco donato resta nel conto vincolato dedicato</strong> (IBAN PostFinance separato dalla gestione corrente di LMT) e viene impiegato esclusivamente per il progetto Dar al-Salam. Se la Fase 1 non chiudesse in tempo, il consiglio LMT comunicherà alla comunità come procedere, in piena trasparenza."
faq_a6_p3 = "La nostra responsabilità verso chi dona viene prima del nostro calendario."

faq_q7 = "Posso visitare la Moschea attuale a Viganello (Lugano)?"
faq_a7_p1 = "Sì, ti aspettiamo. La nostra Moschea è aperta tutto il giorno, spesso anche la notte. Puoi trovarci riuniti agli orari di preghiera — il momento migliore per capire chi siamo è il venerdì, alla Jumu'a, quando la comunità è al completo."
faq_a7_p2_pre = "<strong>Indirizzo:</strong> "
faq_a7_p3 = "Se preferisci un appuntamento privato per parlare del progetto col presidente o con il consiglio, scrivi a"
faq_a7_p3_post = ". Rispondiamo entro 48 ore."

faq_q8 = "Riceverò una ricevuta?"
