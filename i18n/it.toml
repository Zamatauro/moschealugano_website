trasp_body_p2 = "Il comitato attualmente in carica è stato eletto il 23 gennaio 2019. Presidente e tesoriere è <strong>Samir Gomaa</strong> (firma individuale). Vicepresidente, <strong>Radouan Jelassi</strong>. Membro e segretario, <strong>Adnan Al Hariri</strong>."
trasp_body_p3 = "Le donazioni alla campagna Dar al-Salam confluiscono su un <strong>conto IBAN PostFinance dedicato e separato</strong> dalla gestione ordinaria dell'associazione, intestato a Lega dei Musulmani in Ticino con causale dedicata \"Progetto Nuova Moschea\". Tutti i movimenti sono tracciabili e auditabili."
trasp_body_p4 = "Il rendiconto della raccolta è pubblicato settimanalmente in questa pagina. Il bilancio annuale completo dell'associazione è depositato e disponibile."
