perche_v2_p1 = "Vent'anni che preghiamo in cento metri quadri a Viganello (Lugano). Da vent'anni siamo ospiti: la sala dove preghiamo non è nostra, la prendiamo in affitto mese dopo mese, senza la certezza che domani sarà ancora lì. La comunità è cresciuta, lo spazio no."
perche_v2_p2 = "<strong>Mantenerla aperta ci è costato circa CHF 400'000 di affitto.</strong> Soldi che hanno tenuto accese le luci, ma non sono mai diventati casa nostra."
perche_v2_p3 = "Quest'anno Allah ci ha aperto una porta. A Pregassona, in via Ceresio 53B, c'è un terreno <strong>che possiamo finalmente comprare</strong>. Lo abbiamo chiamato <strong>Dar al-Salam — una nuova casa di pace</strong>."
perche_v2_p4 = "<strong>Abbiamo tempo fino al 15 settembre.</strong> Quello che manca dobbiamo raccoglierlo insieme. Ogni franco che doni oggi è <strong>Sadaqa jariya</strong> — un'opera che continua a portare frutto ogni volta che un bambino imparerà il Corano in quella sala, ogni volta che un fratello pregherà Taraweeh, ogni volta che una sorella in difficoltà troverà chi la ascolta."
