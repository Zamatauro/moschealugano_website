# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Vent'anni che preghiamo in cento metri quadri a Bottogno. Da vent'anni siamo ospiti: la sala dove preghiamo non è nostra, la prendiamo in affitto mese dopo mese, senza la certezza che domani sarà ancora lì. La comunità è cresciuta, lo spazio no."
perche_v2_p2 = "<strong>Mantenerla aperta ci è costato circa CHF 400'000 di affitto.</strong> Soldi che hanno tenuto accese le luci, ma non sono mai diventati casa nostra."
perche_v2_p3 = "Quest'anno Allah ci ha aperto una porta. A Pregassona, in via Ceresio 53B, c'è un terreno <strong>che possiamo finalmente comprare</strong>. Lo abbiamo chiamato <strong>Dar al-Salam — una nuova casa di pace</strong>."
perche_v2_p4 = "<strong>Abbiamo tempo fino al 15 settembre.</strong> Quello che manca dobbiamo raccoglierlo insieme. Ogni franco che doni oggi è <strong>sadaqa jariya</strong> — un'opera che continua a portare frutto ogni volta che un bambino imparerà il Corano in quella sala, ogni volta che un fratello pregherà taraweeh, ogni volta che una sorella in difficoltà troverà chi la ascolta."
perche_p1 = "Vent'anni che preghiamo in cento metri quadri a Bottogno."
perche_p2 = "Una sala in affitto, dietro una porta che a Lugano nessuno conosce. Lì, ogni venerdì, settemila musulmani in Ticino sanno che possono fermarsi a pregare la jumu'a. Lì la nostra scuola domenicale El Nur insegna l'alif-ba a una trentina di bambini, italofoni nati a Lugano. Lì spezziamo il digiuno insieme nel mese di Ramadan, lì preghiamo la janazah quando un fratello torna ad Allah, lì accogliamo le sorelle e i fratelli che arrivano in Ticino e non hanno ancora una casa."
perche_p3_pre = "Per tenere in piedi quella sala abbiamo pagato, in vent'anni, circa "
perche_p3_strong = "CHF 400'000 di affitto"
perche_p3_post = ". Soldi versati a un proprietario, mese dopo mese, senza che restasse nulla alla comunità."
perche_beat = "Quattrocento mila franchi. I volti dei nostri bambini. Le mani di chi ha preparato cento iftar."
perche_p5_pre = "Quest'anno Allah ci ha aperto una porta. A "
perche_p5_strong = "Pregassona, in via Ceresio 53B"
perche_p5_post = ", c'è una particella. È nostra. L'abbiamo comprata insieme allo studio dell'architetto Beier Cabrini, che ha già il progetto pronto: sala polivalente, sala di preghiera quotidiana, scuola, ufficio, e sei appartamenti sopra che pagheranno il funzionamento del centro per sempre."
perche_p6_pre = "L'abbiamo chiamata "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = "."
perche_claim = "Una nuova casa di pace."
perche_p7_pre = "Ci servono "
perche_p7_strong_pre = " franchi entro il 15 settembre 2026"
perche_p7_strong_post = ""
perche_p7_post = " per chiudere l'acquisto del terreno, il progetto, l'atto notarile, l'intermediazione e le spese legali. Una parte è già coperta dai fratelli e dalle sorelle che hanno donato in questi anni — "
perche_p7_raised_post = " franchi. Quello che manca lo raccogliamo insieme nei prossimi quattro mesi."
perche_p8_pre = "Ogni franco che metti oggi è "
perche_p8_strong = "sadaqa jariya"
