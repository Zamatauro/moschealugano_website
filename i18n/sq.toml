voci_intro = "Janë njerëzit që prej njëzet vjetësh e mbajnë në këmbë këtë bashkësi. Janë presidenti, imami, nënat e shkollës së së dielës, të rinjtë e lindur në Lugano, pleqtë që e hapën xhaminë kur bashkësia në Lugano ishte ende një grusht familjesh. Janë ata që, në këto javë, po zgjedhin të vendosen para kamerës për të treguar se çfarë do të jetë Dar al-Salam."
