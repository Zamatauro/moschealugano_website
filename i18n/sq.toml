# Versione V2 (8 mag 2026): testo asciutto, 4 paragrafi, no cifra dinamica
perche_v2_p1 = "Njëzet vjet që lutemi në njëqind metra katrorë në Bottogno. Prej njëzet vjetësh jemi mysafirë: salla ku lutemi nuk është e jona, e marrim me qira muaj pas muaji, pa siguri se nesër do të jetë ende aty. Bashkësia është rritur, hapësira jo."
perche_v2_p2 = "<strong>Ta mbajmë të hapur na ka kushtuar rreth CHF 400'000 qira.</strong> Para që kanë mbajtur dritat ndezur, por që nuk u kthyen kurrë në shtëpinë tonë."
perche_v2_p3 = "Këtë vit Allahu na ka hapur një derë. Në Pregassona, në Via Ceresio 53B, ka një tokë <strong>që më në fund mund ta blejmë</strong>. E kemi quajtur <strong>Dar al-Salam — një shtëpi e re paqeje</strong>."
perche_v2_p4 = "<strong>Kemi kohë deri më 15 shtator.</strong> Atë që mungon duhet ta mbledhim së bashku. Çdo frangë që dhuron sot është <strong>sadaka xharije</strong> — një vepër që vazhdon të japë fryt sa herë që një fëmijë do të mësojë Kuranin në atë sallë, sa herë që një vëlla do të falë teravinë, sa herë që një motër në vështirësi do të gjejë dikë që e dëgjon."
perche_p1 = "Prej njëzet vjetësh lutemi në njëqind metra katrorë në Bottogno."
perche_p2 = "Një sallë me qira, prapa një dere që në Lugano nuk e njeh kush. Atje, çdo të premte, shtatë mijë myslimanë të Tiçinos e dinë se mund të ndalen për namazin e xhumasë. Atje shkolla jonë e së dielës El Nur u mëson alif-ba-në rreth tridhjetë fëmijëve italishtfolës të lindur në Lugano. Atje hapim iftarin së bashku gjatë muajit të Ramazanit, atje falim xhenazen kur një vëlla kthehet te Allahu, atje presim motra e vëllezër që mbërrijnë në Tiçino dhe ende nuk kanë një shtëpi."
perche_p3_pre = "Për ta mbajtur atë sallë në këmbë, kemi paguar gjatë njëzet vjetëve rreth "
perche_p3_strong = "CHF 400'000 qira"
perche_p3_post = ". Para të derdhura çdo muaj te një pronar, pa lënë asgjë për bashkësinë."
perche_beat = "Katërqind mijë franga. Fytyrat e fëmijëve tanë. Duart e atyre që kanë përgatitur njëqind iftare."
perche_p5_pre = "Këtë vit Allahu na ka hapur një derë. Në "
perche_p5_strong = "Pregassona, në via Ceresio 53B"
perche_p5_post = ", ka një parcelë. Është e jona. E kemi blerë bashkë me studion e arkitektit Beier Cabrini, që e ka projektin gati: sallë shumëfunksionale, sallë lutjeje e përditshme, shkollë, zyrë, dhe gjashtë apartamente sipër që do të paguajnë funksionimin e qendrës përgjithmonë."
perche_p6_pre = "E kemi quajtur "
perche_p6_strong = "Dar al-Salam"
perche_p6_post = "."
perche_claim = "Një shtëpi e re paqeje."
perche_p7_pre = "Na duhen "
perche_p7_strong_pre = " deri më 15 shtator 2026"
perche_p7_strong_post = ""
perche_p7_post = " për të mbyllur blerjen e tokës, projektin, aktin noterial, ndërmjetësimin dhe shpenzimet ligjore. Një pjesë është mbuluar tashmë nga vëllezërit dhe motrat që kanë dhuruar gjatë këtyre viteve — CHF "
perche_p7_raised_post = ". Atë që mungon e mbledhim së bashku në katër muajt e ardhshëm."
perche_p8_pre = "Çdo frangë që ti vendos sot është "
perche_p8_strong = "sadaka xharije"
perche_p8_post = ": një vepër që vazhdon të japë fryt sa herë që një fëmijë do të mësojë të lexojë Kuranin në atë sallë, sa herë që një vëlla do të falë teravinë në Ramazan, sa herë që një motër në vështirësi do të gjejë veshë për t'u dëgjuar."
