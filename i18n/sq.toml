trasp_body_p1_pre = "<a href=\"https://islam-lugano.ch/\" target=\"_blank\" rel=\"noopener\">Lega dei Musulmani in Ticino</a> është e regjistruar në Regjistrin e Tregtisë të Kantonit të Tiçinos që nga 20 qershori 2005 me numrin "
trasp_body_p1_post = ". Është e përjashtuar nga taksat kantonale dhe federale mbi të ardhurat e veta që nga 13 marsi 2014, sipas nenit 65 lett. g të Ligjit Tatimor Kantonal dhe nenit 56 lett. h LIFD federal."
trasp_body_p2 = "Komiteti aktual është zgjedhur më 23 janar 2019. President dhe arkëtar është <strong>Samir Gomaa</strong> (firmë individuale). Nënkryetar, <strong>Radouan Jelassi</strong>. Anëtar dhe sekretar, <strong>Adnan Al Hariri</strong>."
trasp_body_p3 = "Dhurimet për fushatën Dar al-Salam derdhen në një <strong>llogari IBAN PostFinance të dedikuar dhe të ndarë</strong> nga administrimi i zakonshëm i shoqatës, në emër të Lega dei Musulmani in Ticino me arsyen e dedikuar \"Progetto Nuova Moschea\". Të gjitha lëvizjet janë të gjurmueshme dhe të auditueshme."
trasp_body_p4 = "Raporti i mbledhjes së fondeve publikohet çdo javë në këtë faqe. Bilanci vjetor i plotë i shoqatës është i depozituar dhe i disponueshëm."
