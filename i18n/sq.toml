# ---------- FAQ ----------
faq_eyebrow = "FAQ"
faq_h2 = "Pyetje të shpeshta"
faq_title = "Pyetje të shpeshta"

faq_q1 = "A mund të paguaj zekatin për Dar al-Salam?"
faq_a1_p1 = "Përgjigjja varet nga shkolla juridike së cilës i referohesh. Shumica e ulemave të katër shkollave klasike (Hanafi, Maliki, Shafi'i, Hanbeli) e konsiderojnë se zekati është i destinuar në radhë të parë për tetë kategoritë e përmendura në suren et-Teube (60), dhe se ndërtimi i xhamive nuk hyn drejtpërdrejt në to. Disa ulema bashkëkohorë, ndërkohë, e zgjerojnë kategorinë <em>fi sebilil-lah</em> për ta përfshirë."
faq_a1_p2 = "Për të shmangur paqartësinë, të sugjerojmë <strong>t'i caktosh Dar al-Salamit një sadaka vullnetare</strong> — jo zekat — dhe ta paguash zekatin sipas mendimit të imamit tënd të referencës ose sipas organizatës që përdor tashmë. Sadakaja vullnetare për një projekt si ky konsiderohet nga të gjithë ulematë një formë e sadakasë xharije."

faq_q2 = "A mund të bëj një dhurim të përsëritur?"
faq_a2_p1 = "Po, dhe për ne është forma më e çmuar. Te skeda «Kartë» mund të zgjedhësh ta kthesh dhurimin tënd në <strong>dhurim mujor të përsëritur</strong>, qoftë edhe vetëm CHF 20 në muaj. Katër muaj dhurimi të përsëritur prej CHF 20 janë CHF 80 që hyjnë me siguri në planin tonë të mbledhjes — për ne që planifikojmë, kjo është më e çmuar se një dhurim i madh i njëhershëm që nuk mund ta parashikojmë."
faq_a2_p2 = "Dhurimi i përsëritur është gjithashtu një formë klasike e <strong>sadakasë xharije</strong>: vazhdon të japë fryt muaj pas muaji, pa pasur nevojë të bësh asgjë."
faq_a2_p3 = "Mund ta anulosh në çfarëdo momenti, pa pyetje."

faq_q3 = "A mund të dhuroj në emër të një të vdekuri?"
faq_a3_p1 = "Po. Është një nga format më të nderuara të sadakasë xharije. Profeti (s.a.v.s) ka thënë: <em>«Kur biri i Ademit vdes, veprat e tij ndërpriten përveç tre gjërave — një sadaka xharije, një dije e dobishme e lënë trashëgim, ose një bir i devotshëm që bën dua për të.»</em> (Muslim)."
faq_a3_p2 = "Kur dhuron me kartë, në arsyen e transfertës bankare ose te shënimet e dhurimit, mund të shkruash <em>«në kujtim të [emrit]»</em>. Këshilli i LMT-së do të mbajë një regjistër privat të emrave dhe do të bëjë dua për ta gjatë hapjes së qendrës. Asnjë emër nuk do të publikohet pa lejen e shprehur të familjes."

faq_q4 = "A është dhurimi im i zbritshëm fiskalisht?"
faq_a4_p1_pre = "Lega dei Musulmani in Ticino (LMT) është e regjistruar në Regjistrin e Tregtisë që nga 20 qershori 2005 me numrin "
faq_a4_p1_post = ", dhe është e përjashtuar nga taksat kantonale dhe federale <strong>mbi të ardhurat e veta</strong> që nga 13 marsi 2014."
faq_a4_p2 = "<strong>Po verifikojmë</strong> nëse i njëjti përjashtim shtrihet edhe te zbritshmëria e dhurimeve individuale për dhuruesin. Është një verifikim i ndarë nga përjashtimi i shoqatës dhe kërkon konfirmim formal nga autoritetet tatimore. Do ta përditësojmë këtë faqe sapo të kemi përgjigjen me shkrim."
faq_a4_p3 = "Për dhuruesit italianë, francezë, gjermanë: zbritshmëria varet nga legjislacioni i vendit tënd dhe nga marrëveshjet dypalëshe me Zvicrën. Ruaje faturën automatike që merr me email — është dokumenti që të duhet kur bën deklaratën."

faq_q5 = "Kur do të hapet Dar al-Salam?"
faq_a5_p1 = "Etapat me radhë. Para <strong>15 shtatorit 2026</strong> mbyllim mbledhjen e Fazës 1 (toka + lejet). Nga shtatori 2026 deri në fund të 2027-ës depozitohen lejet e ndërtimit dhe kërkohet mbulimi financiar i Fazës 2. Nga fillimi i 2027-ës — <em>insha'Allah</em> — fillojnë punimet. Kohëzgjatja e parashikuar e ndërtimit është rreth tetëmbëdhjetë muaj."
faq_a5_p2 = "Realisht, hapja e qendrës pritet <strong>mes 2028 dhe 2029</strong>."
faq_a5_p3 = "Të gjitha përditësimet mbi fazat e projektit publikohen çdo javë në këtë faqe dhe çdo muaj në raportin publik."

faq_q6 = "Po sikur të mos e mbyllim mbledhjen para 15 shtatorit?"
faq_a6_p1 = "Përgjigjja e sinqertë: parcela do të mbetej e jona derisa të skadonte afati i rënë dakord me shitësin, por do të rrezikonim të humbisnim të drejtën e blerjes dhe të rikthehemi në kërkim. Prandaj ky afat nuk është simbolik — është real."
faq_a6_p2 = "Sidoqoftë, <strong>çdo frangë e dhuruar mbetet në llogarinë e dedikuar</strong> (IBAN PostFinance i ndarë nga administrimi i përditshëm i LMT-së) dhe përdoret ekskluzivisht për projektin Dar al-Salam. Nëse Faza 1 nuk mbyllet në kohë, këshilli i LMT-së do t'i komunikojë bashkësisë si do të vazhdohet, me transparencë të plotë."
faq_a6_p3 = "Përgjegjësia jonë ndaj atyre që dhurojnë vjen para kalendarit tonë."

faq_q7 = "A mund ta vizitoj xhaminë aktuale në Bottogno?"
faq_a7_p1 = "Po, të presim. Xhamia e Bottogno-s është e hapur gjatë gjithë ditës, shpesh edhe natën. Mund të na gjesh të mbledhur në kohët e namazit — momenti më i mirë për të kuptuar kush jemi është e premtja, te xhumaja, kur bashkësia është e plotë."
faq_a7_p2_pre = "<strong>Adresa:</strong> "
faq_a7_p3 = "Nëse preferon një takim privat për të folur për projektin me presidentin ose me këshillin, shkruaj në"
faq_a7_p3_post = ". Përgjigjemi brenda 48 orësh."

faq_q8 = "A do të marr një faturë?"
faq_a8_p1 = "Për dhurimet me kartë, Apple Pay dhe Google Pay, fatura mbërrin automatikisht me email. Për mënyrat e tjera, nëse nuk e merr, na shkruaj në"
faq_a8_p1_post = "duke shënuar datën dhe shumën e dhurimit dhe ta dërgojmë."
faq_a8_p2 = "Të gjitha faturat mbajnë"
faq_a8_p2_post = "dhe referencën e përjashtimit fiskal, të vlefshme për deklaratën e të ardhurave."

